    /* =====================================================
       PEDIDOS - REGRAS DE INTEGRIDADE E EXCLUSÃO DEFINITIVA
    ====================================================== */
    const PEDIDO_STATUS_BLOQUEADOS = new Set([
      'ENTREGUE'
    ]);

    function normalizarStatus(status) {
      return String(status || '')
        .trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toUpperCase();
    }

    // Pedidos pagos por Pix/link (via workflow separado do Mercado Pago) entram
    // direto com status "Pedido recebido, aguardando pagamento" \u2014 sem passar por
    // "NOVO" \u2014 mas pra quem est\u00e1 na loja isso tamb\u00e9m \u00e9 um pedido novo, que acabou
    // de chegar e ainda n\u00e3o foi tratado. Por isso conta como "novo" no dashboard.
    function pedidoEhNovo(status) {
      const st = normalizarStatus(status);
      return st === 'NOVO' || st === 'NOVOS' || st === 'PEDIDO RECEBIDO, AGUARDANDO PAGAMENTO';
    }

    function pedidoEstaBloqueado(status) {
      return PEDIDO_STATUS_BLOQUEADOS.has(normalizarStatus(status));
    }

    function getPedidoId(pedido) {
      return getValue(pedido, ['id','ID','pedido_id','PEDIDO_ID'], null);
    }

    function getPedidoStatus(pedido) {
      return getValue(pedido, ['status','STATUS'], 'NOVO');
    }

    async function patchPedido(id, payload, pedidoAtual=null) {
      const idKey = pedidoAtual
        ? (Object.keys(pedidoAtual).find(k => k.toLowerCase() === 'id') || 'ID')
        : 'ID';

      const filter = '?' + encodeURIComponent(idKey) + '=eq.' + encodeURIComponent(id);

      const payloadReal = {};
      Object.keys(payload).forEach(key => {
        if (!pedidoAtual) {
          payloadReal[key] = payload[key];
          return;
        }
        const realKey = Object.keys(pedidoAtual).find(k => k.toLowerCase() === key.toLowerCase()) || key;
        payloadReal[realKey] = payload[key];
      });

      const tentativas = [
        { table:'PEDIDOS', body:payloadReal },
        { table:'pedidos', body:payloadReal }
      ];

      let ultimoErro = null;

      for (const tentativa of tentativas) {
        try {
          const resultado = await restRequest(tentativa.table, filter, {
            method:'PATCH',
            headers:{'Prefer':'return=representation'},
            body:JSON.stringify(tentativa.body)
          });

          if (!Array.isArray(resultado) || resultado.length !== 1) {
            throw new Error('O Supabase não confirmou a atualização do pedido. Nenhuma linha foi alterada.');
          }

          return resultado;
        } catch (e) {
          ultimoErro = e;
        }
      }

      throw ultimoErro || new Error('Não foi possível atualizar o pedido.');
    }

    async function deletePedido(id, pedidoAtual = null) {
      const pedido = pedidoAtual || obterPedidoAtual(id) || {};
      const idKey = Object.keys(pedido).find(k => k.toLowerCase() === 'id') || 'id';
      const idVal = pedido[idKey] !== undefined && pedido[idKey] !== null ? pedido[idKey] : id;
      const numKey = Object.keys(pedido).find(k => k.toLowerCase() === 'numero_pedido');
      const numVal = numKey ? pedido[numKey] : null;

      const chavesParaExcluir = [...new Set([String(idVal), numVal ? String(numVal) : null, String(id)].filter(Boolean))];

      // 1. Remove dependências de ITENS_PEDIDO para evitar trava de chave estrangeira
      for (const val of chavesParaExcluir) {
        try { await supabaseClient.from('ITENS_PEDIDO').delete().eq('PEDIDO_ID', val); } catch (e) {}
        try { await supabaseClient.from('ITENS_PEDIDO').delete().eq('pedido_id', val); } catch (e) {}
        try { await restRequest('ITENS_PEDIDO', '?PEDIDO_ID=eq.' + encodeURIComponent(val), { method: 'DELETE' }); } catch (e) {}
        try { await restRequest('ITENS_PEDIDO', '?pedido_id=eq.' + encodeURIComponent(val), { method: 'DELETE' }); } catch (e) {}
      }

      // 2. Remove o pedido na tabela PEDIDOS
      let excluiu = false;
      let erroFinal = null;

      try {
        const { data, error } = await supabaseClient
          .from('PEDIDOS')
          .delete()
          .eq(idKey, idVal)
          .select();

        if (error) erroFinal = error;
        else if (Array.isArray(data) && data.length > 0) excluiu = true;
      } catch (err) {
        erroFinal = err;
      }

      if (!excluiu && numKey && numVal) {
        try {
          const { data, error } = await supabaseClient
            .from('PEDIDOS')
            .delete()
            .eq(numKey, numVal)
            .select();

          if (!error && Array.isArray(data) && data.length > 0) excluiu = true;
        } catch (err) {}
      }

      if (!excluiu) {
        try {
          const resp = await restRequest('PEDIDOS', '?' + encodeURIComponent(idKey) + '=eq.' + encodeURIComponent(String(idVal)), {
            method: 'DELETE',
            headers: { 'Prefer': 'return=representation' }
          });
          if (Array.isArray(resp) && resp.length > 0) {
            excluiu = true;
          }
        } catch (err) {
          if (!erroFinal) erroFinal = err;
        }
      }

      if (!excluiu) {
        throw new Error(
          erroFinal?.message ||
          'Nenhuma linha foi apagada no banco. Verifique se o RLS (Row Level Security) da tabela PEDIDOS possui permissão de DELETE liberada.'
        );
      }

      return true;
    }

    function obterPedidoAtual(id) {
      return pedidosCache.find(p => {
        const pId = getPedidoId(p);
        const pNum = getValue(p, ['NUMERO_PEDIDO', 'numero_pedido', 'id', 'ID'], null);
        return String(pId) === String(id) || String(pNum) === String(id);
      }) || null;
    }

    function normalizarTelefoneWhatsApp(valor) {
      let numero = String(valor ?? '').replace(/\D/g, '');
      if (!numero) return '';
      if (numero.length === 10 || numero.length === 11) numero = '55' + numero;
      return numero;
    }

    function normalizarTextoComparacao(valor) {
      return String(valor ?? '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .toUpperCase().trim().replace(/\s+/g,' ');
    }

    function pontuarClienteDoPedido(cliente, pedido) {
      let pontos = 0;
      const cCep = String(getValue(cliente,['CEP','cep'],'')).replace(/\D/g,'');
      const pCep = String(getValue(pedido,['CEP','cep'],'')).replace(/\D/g,'');
      if (cCep && pCep && cCep === pCep) pontos += 4;

      const cEndereco = normalizarTextoComparacao(getValue(cliente,['ENDERECO','endereco','RUA','rua'],''));
      const pEndereco = normalizarTextoComparacao(getValue(pedido,['ENDERECO','endereco','RUA','rua'],''));
      if (cEndereco && pEndereco && cEndereco === pEndereco) pontos += 4;

      const cNumero = normalizarTextoComparacao(getValue(cliente,['NUMERO','numero'],''));
      const pNumero = normalizarTextoComparacao(getValue(pedido,['NUMERO','numero'],''));
      if (cNumero && pNumero && cNumero === pNumero) pontos += 2;

      const cBairro = normalizarTextoComparacao(getValue(cliente,['BAIRRO','bairro'],''));
      const pBairro = normalizarTextoComparacao(getValue(pedido,['BAIRRO','bairro'],''));
      if (cBairro && pBairro && cBairro === pBairro) pontos += 2;

      const cCidade = normalizarTextoComparacao(getValue(cliente,['CIDADE','cidade'],''));
      const pCidade = normalizarTextoComparacao(getValue(pedido,['CIDADE','cidade'],''));
      if (cCidade && pCidade && cCidade === pCidade) pontos += 1;

      return pontos;
    }

    function montarClienteResolvido(c, origem) {
      if (!c) return null;
      const telefone = getValue(c,['WHATSAPP','whatsapp','TELEFONE','telefone','CELULAR','celular','PHONE','phone'],'');
      if (!normalizarTelefoneWhatsApp(telefone)) return null;
      return {
        id: getValue(c,['ID','id'],null),
        whatsapp: telefone,
        nome: getValue(c,['NOME','nome','CLIENTE_NOME','cliente_nome'],'Cliente'),
        origem: origem || 'CLIENTES'
      };
    }

    async function obterClienteDoPedido(pedido) {
      const direto = getValue(pedido,['WHATSAPP','whatsapp','TELEFONE','telefone','CELULAR','celular','PHONE','phone'],'');
      const nomeDireto = getValue(pedido,['CLIENTE_NOME','cliente_nome','NOME_CLIENTE','nome_cliente','NOME','nome'],'');
      if (normalizarTelefoneWhatsApp(direto)) {
        return { id:getValue(pedido,['CLIENTE_ID','cliente_id'],null), whatsapp:direto, nome:nomeDireto || 'Cliente', origem:'PEDIDO' };
      }

      const clientes = await getTable('CLIENTES','?select=*');
      const lista = Array.isArray(clientes) ? clientes : [];

      const clienteId = getValue(pedido,['CLIENTE_ID','cliente_id'],null);
      if (clienteId !== null && clienteId !== undefined && String(clienteId) !== '') {
        const encontrado = lista.find(c => String(getValue(c,['ID','id'],'')) === String(clienteId));
        const resolvido = montarClienteResolvido(encontrado,'CLIENTE_ID');
        if (resolvido) return resolvido;
      }

      const candidatos = lista
        .map(c => ({ cliente:c, pontos:pontuarClienteDoPedido(c,pedido) }))
        .filter(x => x.pontos >= 8)
        .sort((a,b) => b.pontos - a.pontos);

      if (candidatos.length) {
        const melhor = candidatos[0];
        const segundo = candidatos[1];
        if (!segundo || melhor.pontos > segundo.pontos) {
          const resolvido = montarClienteResolvido(melhor.cliente,'ENDERECO');
          if (resolvido) return resolvido;
        }
      }

      return null;
    }

    async function enviarStatusWhatsApp(pedido, statusAnterior, novoStatus, clienteResolvido=null) {
      const cliente = clienteResolvido || await obterClienteDoPedido(pedido);
      const telefone = cliente && cliente.whatsapp ? normalizarTelefoneWhatsApp(cliente.whatsapp) : '';
      if (!telefone) {
        throw new Error('Não foi possível localizar um cliente com TELEFONE/WHATSAPP para este pedido. Cadastre ou vincule o cliente antes de enviar a notificação.');
      }
      const numeroPedido = getValue(pedido,['NUMERO_PEDIDO','numero_pedido','ID','id'],'');
      const payload = {
        evento: 'STATUS_PEDIDO_ATUALIZADO',
        pedido_id: getPedidoId(pedido),
        numero_pedido: numeroPedido,
        status_anterior: statusAnterior,
        novo_status: novoStatus,
        status: novoStatus,
        cliente_id: cliente.id ?? getValue(pedido,['CLIENTE_ID','cliente_id'],null),
        cliente: cliente.nome || 'Cliente',
        cliente_nome: cliente.nome || 'Cliente',
        telefone: telefone,
        whatsapp: telefone,
        endereco: getValue(pedido,['ENDERECO','endereco'],''),
        numero: getValue(pedido,['NUMERO','numero'],''),
        complemento: getValue(pedido,['COMPLEMENTO','complemento'],''),
        bairro: getValue(pedido,['BAIRRO','bairro'],''),
        cidade: getValue(pedido,['CIDADE','cidade'],''),
        cep: getValue(pedido,['CEP','cep'],''),
        valor_total: getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],null),
        desconto: getValue(pedido,['DESCONTO','desconto'],0),
        valor_total_sem_desconto: parseMoneyValue(getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],0)) + parseMoneyValue(getValue(pedido,['DESCONTO','desconto'],0)),
        valor_final: getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],null),
        mensagem_financeira: parseMoneyValue(getValue(pedido,['DESCONTO','desconto'],0)) > 0
          ? `Subtotal: ${formatMoney(parseMoneyValue(getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],0)) + parseMoneyValue(getValue(pedido,['DESCONTO','desconto'],0)))} | Desconto: ${formatMoney(getValue(pedido,['DESCONTO','desconto'],0))} | Total: ${formatMoney(getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],0))}`
          : `Total: ${formatMoney(getValue(pedido,['VALOR_TOTAL','valor_total','TOTAL','total'],0))}`,
        observacao: getValue(pedido,['OBSERVACAO','observacao'],'')
      };
      await fetch(STATUS_PEDIDO_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify(payload)
      });
      return true;
    }

    async function atualizarStatusPedido(id, statusSelecionado = '') {
      const pedido = obterPedidoAtual(id);
      if (!pedido) { showToast('Pedido não encontrado','Atualize a lista e tente novamente.'); return; }
      const statusAtual = getPedidoStatus(pedido);
      if (pedidoEstaBloqueado(statusAtual)) { showToast('🔒 Pedido bloqueado','Pedidos concluídos, fechados ou finalizados não podem ser alterados.'); return; }
      const select = document.getElementById('statusPedido_'+id);
      const novoStatus = String(statusSelecionado || (select ? select.value : '') || '').trim();
      if (!novoStatus) { showToast('Status obrigatório','Escolha o novo status.'); return; }
      if (normalizarStatus(novoStatus) === normalizarStatus(statusAtual)) { showToast('Sem alteração','Escolha um status diferente do atual.'); return; }
      if (!confirm('Confirmar alteração do status do pedido #'+id+' de "'+statusAtual+'" para "'+novoStatus+'"?')) return;

      try {
        let clienteResolvido = null;
        try { clienteResolvido = await obterClienteDoPedido(pedido); }
        catch (e) { console.error('Erro ao localizar cliente:',e); }

        const chaveStatus = Object.keys(pedido).find(k => k.toLowerCase() === 'status') || 'STATUS';
        const chaveDataAtualizacao = Object.keys(pedido).find(k => k.toLowerCase() === 'data_atualizacao') || null;
        const payloadUpdate = {};
        payloadUpdate[chaveStatus] = novoStatus;
        if (chaveDataAtualizacao) payloadUpdate[chaveDataAtualizacao] = new Date().toISOString();

        const clienteIdAtual = getValue(pedido,['CLIENTE_ID','cliente_id'],null);
        const chaveClienteId = Object.keys(pedido).find(k => k.toLowerCase() === 'cliente_id') || 'CLIENTE_ID';
        if ((clienteIdAtual === null || clienteIdAtual === undefined || clienteIdAtual === '') && clienteResolvido && clienteResolvido.id !== null && clienteResolvido.id !== undefined) {
          payloadUpdate[chaveClienteId] = clienteResolvido.id;
          pedido[chaveClienteId] = clienteResolvido.id;
        }

        const resultadoPatch = await patchPedido(id, payloadUpdate, pedido);
        const pedidoAtualizado = Array.isArray(resultadoPatch) ? resultadoPatch[0] : null;
        if (pedidoAtualizado) {
          const indice = pedidosCache.findIndex(p => String(getPedidoId(p)) === String(id));
          if (indice >= 0) pedidosCache[indice] = {...pedidosCache[indice], ...pedidoAtualizado};
        }

        const deveEnviarWhatsApp = [
          'PEDIDO RECEBIDO, AGUARDANDO PAGAMENTO',
          'PAGAMENTO CONFIRMADO, EM PRODUÇÃO',
          'PRONTO PARA RETIRADA',
          'ENTREGUE'
        ].includes(normalizarStatus(novoStatus));

        if (deveEnviarWhatsApp) {
          try {
            await enviarStatusWhatsApp(pedidoAtualizado || pedido, statusAtual, novoStatus, clienteResolvido);
            showToast('Status atualizado','Pedido atualizado e mensagem enviada ao WhatsApp do cliente.');
          } catch (zapError) {
            console.error('WhatsApp:', zapError);
            showToast('Status atualizado','Pedido salvo, mas a mensagem do WhatsApp não foi enviada: '+zapError.message);
          }
        } else {
          showToast('Status atualizado','Pedido atualizado com sucesso.');
        }
        await carregarPedidos(false);
      } catch (error) {
        console.error('Erro ao alterar status:', error);
        showToast('Erro ao atualizar','Não foi possível alterar o status: ' + error.message);
      }
    }

        <div class="field"><label>Valor dos produtos</label><input type="number" step="0.01" min="0" id="pedidoEditSubtotal" value="${escapeHtml(String(subtotalAtual.toFixed(2)))}"></div>
        <div class="field"><label>Desconto</label><input type="number" step="0.01" min="0" id="pedidoEditDesconto" value="${escapeHtml(String(parseMoneyValue(descontoAtual).toFixed(2)))}" placeholder="0,00"><small style="display:block;margin-top:6px;color:var(--cinza);">O desconto será abatido automaticamente do total.</small></div>
        <div class="field"><label>Total com desconto</label><input type="text" id="pedidoEditTotalFinal" value="${escapeHtml(formatMoney(subtotalAtual - parseMoneyValue(descontoAtual)))}" readonly style="font-weight:800;background:#f8eee4;color:var(--vermelho);"></div>
        <div class="field"><label>Observação</label><textarea id="pedidoEditObs">${escapeHtml(obsAtual ?? '')}</textarea></div>
        <div class="actions-inline" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary-button" id="pedidoEditCancel">Cancelar</button><button type="button" class="primary-button" id="pedidoEditSave">💾 Salvar alterações</button></div>
      </div>`;
      document.body.appendChild(modal);

      const close=()=>{ modal.remove(); document.body.classList.remove('modal-open'); };
      modal.querySelector('#pedidoEditClose').addEventListener('click',close);
      modal.querySelector('#pedidoEditCancel').addEventListener('click',close);
      modal.addEventListener('click',event=>{ if(event.target===modal) close(); });

      const atualizarTotalFinal = () => {
        const subtotal = Number(String(modal.querySelector('#pedidoEditSubtotal').value || '0').replace(',','.'));
        const desconto = Number(String(modal.querySelector('#pedidoEditDesconto').value || '0').replace(',','.'));
        const totalFinal = Number.isFinite(subtotal) && Number.isFinite(desconto) ? Math.max(0, subtotal - desconto) : 0;
        modal.querySelector('#pedidoEditTotalFinal').value = formatMoney(totalFinal);
      };
      modal.querySelector('#pedidoEditSubtotal').addEventListener('input', atualizarTotalFinal);
      modal.querySelector('#pedidoEditDesconto').addEventListener('input', atualizarTotalFinal);

      modal.querySelector('#pedidoEditSave').addEventListener('click',async()=>{
        const button=modal.querySelector('#pedidoEditSave');
        const subtotal=Number(String(modal.querySelector('#pedidoEditSubtotal').value || '0').replace(',','.'));
        const desconto=Number(String(modal.querySelector('#pedidoEditDesconto').value || '0').replace(',','.'));
        const novaObs=modal.querySelector('#pedidoEditObs').value.trim();
        const novoTotal=subtotal-desconto;

        if(!Number.isFinite(subtotal)||subtotal<0) return showToast('Valor inválido','Informe um valor dos produtos numérico válido.');
        if(!Number.isFinite(desconto)||desconto<0) return showToast('Desconto inválido','Informe um desconto igual ou maior que zero.');
        if(desconto>subtotal) return showToast('Desconto inválido','O desconto não pode ser maior que o valor dos produtos.');
        if(!Number.isFinite(novoTotal)||novoTotal<0) return showToast('Valor inválido','O total com desconto não pode ser negativo.');
        if(!confirm('Confirmar alteração do pedido #'+numeroPedido+'?')) return;

        try {
          button.disabled=true; button.textContent='Salvando...';

          const descontoKey = Object.keys(pedido).find(k=>k.toLowerCase()==='desconto');
          const totalKey = Object.keys(pedido).find(k=>k.toLowerCase()==='valor_total') || 'VALOR_TOTAL';
          const obsKey = Object.keys(pedido).find(k=>k.toLowerCase()==='observacao') || 'OBSERVACAO';

          const payload = {};
          payload[totalKey]=novoTotal;
          payload[obsKey]=novaObs;
          if(descontoKey) {
            payload[descontoKey]=desconto;
          } else {
            throw new Error('A coluna DESCONTO ainda não existe na tabela PEDIDOS do Supabase. Crie essa coluna como NUMERIC(10,2) para ativar o desconto.');
          }
          payload[Object.keys(pedido).find(k=>k.toLowerCase()==='data_atualizacao') || 'DATA_ATUALIZACAO']=new Date().toISOString();

          await patchPedido(id,payload,pedido);
          close();
          showToast('Pedido atualizado','Desconto aplicado e total atualizado com sucesso.');
          await carregarPedidos(false);
        } catch(error) {
          console.error('Erro ao editar pedido:',error);
          showToast('Erro ao atualizar',error.message || 'Não foi possível salvar as alterações.');
          button.disabled=false; button.textContent='💾 Salvar alterações';
        }
      });
    }

    async function excluirPedido(id) {
      const pedido = obterPedidoAtual(id);
      if (!pedido) { showToast('Pedido não encontrado','Atualize a lista e tente novamente.'); return; }
      if (pedidoEstaBloqueado(getPedidoStatus(pedido))) {
        showToast('🔒 Pedido bloqueado','Pedidos concluídos não podem ser excluídos.');
        return;
      }
      if (!confirm('EXCLUIR o pedido #' + id + '?\n\nEsta ação apagará os itens e o pedido definitivamente.')) return;
      try {
        await deletePedido(id, pedido);
        pedidosCache = pedidosCache.filter(p => {
          const pId = getPedidoId(p);
          const pNum = getValue(p, ['NUMERO_PEDIDO', 'numero_pedido', 'id', 'ID'], null);
          return String(pId) !== String(id) && String(pNum) !== String(id);
        });
        atualizarDashboard();
        renderPedidosModule();
        showToast('Pedido excluído','O pedido #' + id + ' foi removido com sucesso.');
        await carregarPedidos(false);
      } catch (error) {
        console.error('Erro ao excluir pedido:', error);
        showToast('Erro ao excluir', error.message);
      }
    }

    function abrirPedidosFiltrados(tipo) {
      filtroPedidosAtivo = ['HOJE','APROVADOS'].includes(tipo) ? tipo : 'NOVOS';

      if (filtroPedidosAtivo === 'NOVOS') {
        const cardNovos = document.querySelector('.card-novos-destaque');
        if (cardNovos) cardNovos.classList.add('card-normalizado');
      }

      selectMenuByName('Pedidos');
    }

    function getPedidosFiltradosDashboard() {
      if (filtroPedidosAtivo === 'HOJE') {
        const hoje = localDateKey(new Date());
        return pedidosCache.filter(p => {
          const v = getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],'');
          return localDateKey(v) === hoje;
        });
      }

      if (filtroPedidosAtivo === 'NOVOS') {
        return pedidosCache.filter(p => pedidoEhNovo(getValue(p,['status','STATUS'],'')));
      }

      if (filtroPedidosAtivo === 'APROVADOS') {
        return pedidosCache.filter(p => {
          return normalizarStatus(getValue(p,['status','STATUS'],'')) === 'PAGAMENTO CONFIRMADO, EM PRODUCAO';
        });
      }

      return Array.isArray(pedidosCache) ? [...pedidosCache] : [];
    }

    function limparFiltroPedidos() {
      filtroPedidosAtivo = 'TODOS';
      renderPedidosModule();
    }

    function renderPedidosModule() {
      const container = document.getElementById('moduleContent');
      const pedidosExibidos = getPedidosFiltradosDashboard();
      const linhas = pedidosExibidos.length ? pedidosExibidos.map(p => {
        const id = getPedidoId(p);
        const numero = getValue(p,['NUMERO_PEDIDO','numero_pedido','id','ID'],'-');
        const clienteId = getValue(p,['CLIENTE_ID','cliente_id'], null);
        const clienteNome = getValue(p,['cliente_nome','CLIENTE_NOME','nome_cliente','NOME_CLIENTE'],'') || getClienteNomePorId(clienteId);
        const cliente = clienteNome || (clienteId ? 'Cliente #' + clienteId : 'Cliente não informado');
        const status = getPedidoStatus(p);
        const bloqueado = pedidoEstaBloqueado(status);
        const data = getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],'');
        const total = getValue(p,['VALOR_TOTAL','valor_total','TOTAL','total','valor'],0);
        const pagamento = getValue(p,['FORMA_PAGAMENTO','forma_pagamento','PAGAMENTO','pagamento'],'-');
        const entregaPedido = getValue(p,['FORMA_ENTREGA','forma_entrega'],'');
        const observacaoPedido = getValue(p,['OBSERVACAO','observacao'],'');
        const statusEsc = escapeHtml(status);
        const options = ['NOVO','PEDIDO RECEBIDO, AGUARDANDO PAGAMENTO','PAGAMENTO CONFIRMADO, EM PRODUÇÃO','PRONTO PARA RETIRADA','ENTREGUE']
          .map(st => '<option value="'+escapeHtml(st)+'" '+(normalizarStatus(st)===normalizarStatus(status)?'selected':'')+'>'+escapeHtml(st)+'</option>').join('');
        const actions = bloqueado
          ? '<div class="action-group"><button class="locked-button" type="button" disabled title="Pedido bloqueado">🔒 '+escapeHtml(status)+'</button></div>'
          : '<div class="action-group">'
            + '<div class="status-menu-wrap">'
            + '<label class="status-menu-label">Status</label>'
            + '<select id="statusPedido_'+escapeHtml(id)+'" class="status-select" onchange="atualizarStatusPedido(\''+escapeHtml(id)+'\', this.value)" title="Alterar status do pedido">'
            + options
            + '</select>'
            + '</div>'
            + '<button class="secondary-button" type="button" onclick="editarPedido(\''+escapeHtml(id)+'\')">✏️ Editar</button>'
            + '<button class="danger-button" type="button" onclick="excluirPedido(\''+escapeHtml(id)+'\')">🗑 Excluir</button>'
            + '</div>';
        return '<tr>'
          + '<td><strong>#'+escapeHtml(numero)+'</strong></td>'
          + '<td>'+escapeHtml(cliente)+'</td>'
          + '<td>'+escapeHtml(formatDateTime(data))+'</td>'
          + '<td><span class="status-pill">'+statusEsc+'</span></td>'
          + '<td>'+renderItensPedidoCelula(p)+'</td>'
          + '<td>'+escapeHtml(pagamento)+'</td>'
          + '<td>'+(entregaPedido ? escapeHtml(entregaPedido) : '<span style="color:var(--cinza);">—</span>')+'</td>'
          + '<td>'+(observacaoPedido ? escapeHtml(observacaoPedido) : '<span style="color:var(--cinza);">—</span>')+'</td>'
          + '<td>'+escapeHtml(formatMoney(getValue(p,['DESCONTO','desconto'],0)))+'</td>'
          + '<td>'+escapeHtml(formatMoney(total))+'</td>'
          + '<td class="actions-cell">'+actions+'</td>'
          + '</tr>';
      }).join('') : '<tr><td colspan="11">Nenhum pedido encontrado para este filtro.</td></tr>';

      const tituloFiltro = filtroPedidosAtivo === 'HOJE'
        ? 'Pedidos de hoje'
        : (filtroPedidosAtivo === 'NOVOS' ? 'Pedidos novos'
        : (filtroPedidosAtivo === 'APROVADOS' ? 'Pedidos aprovados' : 'Pedidos'));

      const descricaoFiltro = filtroPedidosAtivo === 'HOJE'
        ? 'Todos os pedidos criados na data de hoje.'
        : (filtroPedidosAtivo === 'NOVOS'
          ? 'Pedidos que acabaram de chegar e ainda não foram tratados (status NOVO ou aguardando confirmação de pagamento via Pix/link).'
          : (filtroPedidosAtivo === 'APROVADOS'
            ? 'Pedidos com pagamento confirmado (Pix ou link de pagamento) e em produção.'
            : 'Todos os pedidos recebidos pela KUKI, independentemente do status. Pedidos ENTREGUES ficam somente para consulta.'));

      const botaoFiltro = filtroPedidosAtivo !== 'TODOS'
        ? '<button class="secondary-button" type="button" onclick="limparFiltroPedidos()">← Ver todos</button>'
        : '';

      container.innerHTML = '<div class="module-panel">'
        + '<div class="module-toolbar"><div><h2>📦 '+tituloFiltro+'</h2><p style="color:var(--cinza);margin-top:6px;">'+descricaoFiltro+'</p></div><div class="actions-inline">'+botaoFiltro+'<button class="primary-button" type="button" onclick="abrirNovoPedidoManual()">➕ Novo pedido</button><button class="primary-button" onclick="carregarPedidos(false)">↻ Atualizar</button></div></div>'
        + '<div class="order-lock-note">🔒 Regra de integridade: pedidos <strong>ENTREGUES</strong> são considerados concluídos e não podem ser editados, ter o status alterado ou ser excluídos.</div>'
        + '<div class="table-wrap" style="margin-top:16px;"><table class="data-table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Status</th><th>Itens (produção)</th><th>Pagamento</th><th>Entrega</th><th>Observação</th><th>Desconto</th><th>Total</th><th>Ações</th></tr></thead><tbody>'+linhas+'</tbody></table></div></div>';
    }

    /* =====================================================
       PEDIDO MANUAL (novo pedido direto pelo painel)
    ====================================================== */
    let pedManualItens = [];
    let pedManualClienteId = null;
    let pedManualDados = { formasPagamento: [], formasEntrega: [], produtos: [], clientes: [] };

    function pedManualLocalDateTimeValue(date) {
      const d = date instanceof Date ? date : new Date(date);
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function abrirNovoPedidoManual() {
      document.getElementById('modalNovoPedido')?.remove();
      pedManualItens = [{produtoId:'', quantidade:1, preco:0}];
      pedManualClienteId = null;

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'modalNovoPedido';
      document.body.classList.add('modal-open');
      modal.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" style="max-width:720px;">
        <div class="modal-header"><h2>➕ Novo pedido manual</h2><button type="button" class="icon-button" id="pedManualClose">✕</button></div>
        <p style="color:var(--cinza);font-size:13px;margin-top:-8px;margin-bottom:14px;">Use esta tela para lançar um pedido feito por telefone/balcão, ou para cadastrar pedidos antigos (carga inicial de um cliente novo).</p>
        <div id="pedManualBody"><div class="empty-state"><div class="empty-state-icon">⏳</div><strong>Carregando dados...</strong></div></div>
      </div>`;
      document.body.appendChild(modal);
      const close = () => { modal.remove(); document.body.classList.remove('modal-open'); };
      modal.querySelector('#pedManualClose').addEventListener('click', close);
      modal.addEventListener('click', event => { if (event.target === modal) close(); });

      try {
        const [produtos, formasPagamento, formasEntrega, clientes] = await Promise.all([
          getTable('PRODUTOS','?select=*'),
          getTable('FORMAS_PAGAMENTO','?select=*'),
          getTable('FORMAS_ENTREGA','?select=*'),
          getTable('CLIENTES','?select=*')
        ]);
        pedManualDados = {
          produtos: (Array.isArray(produtos)?produtos:[]).filter(p=>getValue(p,['ATIVO','ativo'],true)!==false),
          formasPagamento: (Array.isArray(formasPagamento)?formasPagamento:[]).filter(f=>getValue(f,['ATIVO','ativo'],true)!==false),
          formasEntrega: (Array.isArray(formasEntrega)?formasEntrega:[]).filter(f=>getValue(f,['ATIVO','ativo'],true)!==false),
          clientes: Array.isArray(clientes)?clientes:[]
        };
        pedManualRenderForm(modal);
      } catch(e) {
        console.error('NOVO PEDIDO MANUAL:', e);
        const body = modal.querySelector('#pedManualBody');
        if (body) body.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><strong>Não foi possível carregar os dados.</strong><p style="margin-top:8px;">${escapeHtml(e.message||'Erro de conexão.')}</p></div>`;
      }
    }

    function pedManualRenderForm(modal) {
      const body = modal.querySelector('#pedManualBody');
      if (!body) return;
      const pagamentoOptions = pedManualDados.formasPagamento.map(f => `<option value="${escapeHtml(String(getValue(f,['NOME','nome'],'')))}">${escapeHtml(getValue(f,['NOME','nome'],''))}</option>`).join('');
      const entregaOptions = pedManualDados.formasEntrega.map(f => `<option value="${escapeHtml(String(getValue(f,['NOME','nome'],'')))}">${escapeHtml(getValue(f,['NOME','nome'],''))}</option>`).join('');

      body.innerHTML = `
        <div class="field"><label>Telefone do cliente</label>
          <div class="actions-inline">
            <input type="text" id="pedManualTelefone" placeholder="(11) 99999-9999" style="flex:1;">
            <button type="button" class="secondary-button" id="pedManualBuscarCliente">🔎 Buscar</button>
          </div>
          <small id="pedManualClienteStatus" style="display:block;margin-top:6px;color:var(--cinza);">Digite o telefone e clique em Buscar para preencher os dados automaticamente, se o cliente já existir.</small>
        </div>
        <div class="field"><label>Nome do cliente</label><input type="text" id="pedManualNome" placeholder="Nome completo" required></div>
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;">
          <div class="field"><label>Endereço</label><input type="text" id="pedManualEndereco" placeholder="Rua, avenida..."></div>
          <div class="field"><label>Número</label><input type="text" id="pedManualNumero"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="field"><label>Complemento</label><input type="text" id="pedManualComplemento"></div>
          <div class="field"><label>Bairro</label><input type="text" id="pedManualBairro"></div>
          <div class="field"><label>Cidade</label><input type="text" id="pedManualCidade"></div>
        </div>
        <div class="field"><label>CEP</label><input type="text" id="pedManualCep" style="max-width:180px;"></div>

        <div class="field"><label>Itens do pedido</label>
          <div id="pedManualItensBox"></div>
          <button type="button" class="secondary-button" id="pedManualAddItem" style="margin-top:8px;">＋ Adicionar item</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="field"><label>Forma de pagamento</label><select id="pedManualPagamento"><option value="">Selecione</option>${pagamentoOptions}</select></div>
          <div class="field"><label>Forma de entrega</label><select id="pedManualEntrega"><option value="">Selecione</option>${entregaOptions}</select></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="field"><label>Data do pedido</label><input type="datetime-local" id="pedManualData" value="${pedManualLocalDateTimeValue(new Date())}"></div>
          <div class="field"><label>Status</label>
            <select id="pedManualStatus">
              <option value="NOVO">NOVO</option>
              <option value="PEDIDO RECEBIDO, AGUARDANDO PAGAMENTO">PEDIDO RECEBIDO, AGUARDANDO PAGAMENTO</option>
              <option value="PAGAMENTO CONFIRMADO, EM PRODUÇÃO">PAGAMENTO CONFIRMADO, EM PRODUÇÃO</option>
              <option value="PRONTO PARA RETIRADA">PRONTO PARA RETIRADA</option>
              <option value="ENTREGUE">ENTREGUE</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Observação/Troco</label><textarea id="pedManualObs" placeholder="Ex.: troco para R$ 50"></textarea></div>

        <div class="financeiro-card" style="margin-top:6px;"><div class="label">💰 TOTAL DO PEDIDO</div><div class="value" id="pedManualTotal">R$ 0,00</div></div>

        <div class="actions-inline" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary-button" id="pedManualCancel">Cancelar</button><button type="button" class="primary-button" id="pedManualSave">💾 Salvar pedido</button></div>
      `;

      modal.querySelector('#pedManualCancel').addEventListener('click', () => { modal.remove(); document.body.classList.remove('modal-open'); });
      modal.querySelector('#pedManualBuscarCliente').addEventListener('click', () => pedManualBuscarCliente(modal));
      modal.querySelector('#pedManualAddItem').addEventListener('click', () => { pedManualItens.push({produtoId:'', quantidade:1, preco:0}); pedManualRenderItens(modal); });
      modal.querySelector('#pedManualSave').addEventListener('click', () => pedManualSalvar(modal));

      pedManualRenderItens(modal);
    }

    function pedManualRenderItens(modal) {
      const box = modal.querySelector('#pedManualItensBox');
      if (!box) return;
      const produtoOptionsFor = (selecionadoId) => pedManualDados.produtos.map(p => {
        const id = String(getValue(p,['id','ID'],''));
        const nome = getValue(p,['NOME','nome'],'Produto');
        const preco = parseMoneyValue(getValue(p,['PRECO','preco'],0));
        return `<option value="${escapeHtml(id)}" ${String(selecionadoId)===id?'selected':''}>${escapeHtml(nome)} — ${formatMoney(preco)}</option>`;
      }).join('');

      box.innerHTML = pedManualItens.map((item,i) => `
        <div class="actions-inline" style="align-items:flex-end;margin-bottom:8px;flex-wrap:wrap;" data-item-index="${i}">
          <div class="field" style="flex:2;min-width:180px;margin:0;"><label style="font-size:11px;">Produto</label>
            <select class="ped-item-produto" data-index="${i}"><option value="">Selecione um produto</option>${produtoOptionsFor(item.produtoId)}</select>
          </div>
          <div class="field" style="flex:0 0 90px;margin:0;"><label style="font-size:11px;">Qtd</label><input type="number" min="1" step="1" class="ped-item-qtd" data-index="${i}" value="${item.quantidade}"></div>
          <div class="field" style="flex:0 0 130px;margin:0;"><label style="font-size:11px;">Valor unit.</label><input type="number" min="0" step="0.01" class="ped-item-preco" data-index="${i}" value="${Number(item.preco).toFixed(2)}"></div>
          <div class="ped-item-subtotal" style="flex:0 0 110px;text-align:right;font-weight:800;padding-bottom:8px;">${formatMoney(item.quantidade*item.preco)}</div>
          <button type="button" class="danger-button ped-item-remove" data-index="${i}" title="Remover item" ${pedManualItens.length<=1?'disabled':''}>🗑</button>
        </div>
      `).join('');

      box.querySelectorAll('.ped-item-produto').forEach(sel => sel.addEventListener('change', e => {
        const i = Number(e.target.dataset.index);
        const id = e.target.value;
        const produto = pedManualDados.produtos.find(p => String(getValue(p,['id','ID'],''))===String(id));
        pedManualItens[i].produtoId = id;
        pedManualItens[i].preco = produto ? parseMoneyValue(getValue(produto,['PRECO','preco'],0)) : pedManualItens[i].preco;
        pedManualRenderItens(modal);
      }));
      box.querySelectorAll('.ped-item-qtd').forEach(inp => inp.addEventListener('input', e => {
        const i = Number(e.target.dataset.index);
        pedManualItens[i].quantidade = Math.max(1, Number(e.target.value)||1);
        const linha = box.querySelector(`[data-item-index="${i}"]`);
        if (linha) linha.querySelector('.ped-item-subtotal').textContent = formatMoney(pedManualItens[i].quantidade*pedManualItens[i].preco);
        pedManualAtualizarTotal(modal);
      }));
      box.querySelectorAll('.ped-item-preco').forEach(inp => inp.addEventListener('input', e => {
        const i = Number(e.target.dataset.index);
        pedManualItens[i].preco = Math.max(0, Number(e.target.value)||0);
        const linha = box.querySelector(`[data-item-index="${i}"]`);
        if (linha) linha.querySelector('.ped-item-subtotal').textContent = formatMoney(pedManualItens[i].quantidade*pedManualItens[i].preco);
        pedManualAtualizarTotal(modal);
      }));
      box.querySelectorAll('.ped-item-remove').forEach(btn => btn.addEventListener('click', e => {
        const i = Number(e.target.dataset.index);
        if (pedManualItens.length<=1) return;
        pedManualItens.splice(i,1);
        pedManualRenderItens(modal);
      }));

      pedManualAtualizarTotal(modal);
    }

    function pedManualAtualizarTotal(modal) {
      const total = pedManualItens.reduce((s,it)=>s+(Number(it.quantidade)||0)*(Number(it.preco)||0),0);
      const el = modal.querySelector('#pedManualTotal');
      if (el) el.textContent = formatMoney(total);
    }

    async function pedManualBuscarCliente(modal) {
      const telInput = modal.querySelector('#pedManualTelefone');
      const status = modal.querySelector('#pedManualClienteStatus');
      const digitos = String(telInput.value||'').replace(/\D/g,'');

        const telCliente = String(getValue(c,['TELEFONE','telefone'],'')).replace(/\D/g,'');
        return telCliente && (telCliente === digitos || telCliente.endsWith(digitos) || digitos.endsWith(telCliente));
      });
      if (encontrado) {
        pedManualClienteId = getValue(encontrado,['id','ID'],null);
        modal.querySelector('#pedManualNome').value = getValue(encontrado,['NOME','nome'],'');
        modal.querySelector('#pedManualEndereco').value = getValue(encontrado,['ENDERECO','endereco'],'');
        modal.querySelector('#pedManualNumero').value = getValue(encontrado,['NUMERO','numero'],'');
        modal.querySelector('#pedManualComplemento').value = getValue(encontrado,['COMPLEMENTO','complemento'],'');
        modal.querySelector('#pedManualBairro').value = getValue(encontrado,['BAIRRO','bairro'],'');
        modal.querySelector('#pedManualCidade').value = getValue(encontrado,['CIDADE','cidade'],'');
        modal.querySelector('#pedManualCep').value = getValue(encontrado,['CEP','cep'],'');
        status.textContent = '✅ Cliente encontrado — dados preenchidos automaticamente.';
        status.style.color = '#137333';
      } else {
        pedManualClienteId = null;
        status.textContent = 'Cliente não encontrado com esse telefone — será cadastrado um novo ao salvar o pedido.';
        status.style.color = 'var(--cinza)';
      }

    async function pedManualSalvar(modal) {
      const button = modal.querySelector('#pedManualSave');
      const nome = modal.querySelector('#pedManualNome').value.trim();
      const telefoneDigitado = modal.querySelector('#pedManualTelefone').value.trim();
      const endereco = modal.querySelector('#pedManualEndereco').value.trim();
      const numero = modal.querySelector('#pedManualNumero').value.trim();
      const complemento = modal.querySelector('#pedManualComplemento').value.trim();
      const bairro = modal.querySelector('#pedManualBairro').value.trim();
      const cidade = modal.querySelector('#pedManualCidade').value.trim();
      const cep = modal.querySelector('#pedManualCep').value.trim();
      const pagamento = modal.querySelector('#pedManualPagamento').value;
      const entrega = modal.querySelector('#pedManualEntrega').value;
      const dataValor = modal.querySelector('#pedManualData').value;
      const statusSelecionado = modal.querySelector('#pedManualStatus').value;
      const observacao = modal.querySelector('#pedManualObs').value.trim();

      const itensValidos = pedManualItens.filter(it => it.produtoId && Number(it.quantidade)>0);

      if (!nome) return showToast('Nome obrigatório','Informe o nome do cliente.');
      if (!itensValidos.length) return showToast('Itens obrigatórios','Adicione pelo menos um produto ao pedido.');
      if (!dataValor) return showToast('Data obrigatória','Informe a data do pedido.');
      if (!confirm('Confirmar o lançamento deste pedido manual?')) return;

      button.disabled = true; button.textContent = 'Salvando...';
      try {
        // 1. Resolve ou cadastra o cliente pelo telefone (se informado)
        let clienteId = pedManualClienteId;
        const telefoneDigitos = telefoneDigitado.replace(/\D/g,'');
        if (telefoneDigitos) {
          const payloadCliente = { NOME: nome, TELEFONE: telefoneDigitos, ENDERECO: endereco||null, NUMERO: numero||null, COMPLEMENTO: complemento||null, BAIRRO: bairro||null, CIDADE: cidade||null, CEP: cep||null };
          if (clienteId) {
            try {
              await restRequest('CLIENTES','?id=eq.'+encodeURIComponent(clienteId),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payloadCliente)});
            } catch(e) { console.warn('Não foi possível atualizar o cliente existente:', e); }
          } else {
            try {
              const res = await restRequest('CLIENTES','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payloadCliente)});
              if (Array.isArray(res) && res.length===1) clienteId = getValue(res[0],['id','ID'],null);
            } catch(e) {
              console.warn('Não foi possível cadastrar o cliente automaticamente (talvez o telefone já exista):', e);
              try {
                const busca = await restRequest('CLIENTES','?TELEFONE=eq.'+encodeURIComponent(telefoneDigitos));
                if (Array.isArray(busca) && busca.length) clienteId = getValue(busca[0],['id','ID'],null);
              } catch(e2) {}
            }
          }
        }

        // 2. Calcula o próximo número sequencial (mesma lógica usada no fluxo do n8n)
        let numeroSequencial = 1;
        try {
          const ultimo = await getTable('PEDIDOS','?select=NUMERO_SEQUENCIAL&order=NUMERO_SEQUENCIAL.desc.nullslast&limit=1');
          if (Array.isArray(ultimo) && ultimo.length) numeroSequencial = (Number(getValue(ultimo[0],['NUMERO_SEQUENCIAL','numero_sequencial'],0))||0) + 1;
        } catch(e) { console.warn('Não foi possível calcular o próximo número sequencial, usando fallback:', e); }
        const numeroPedidoFormatado = String(numeroSequencial).padStart(5,'0');

        const valorTotal = itensValidos.reduce((s,it)=>s+(Number(it.quantidade)*Number(it.preco)),0);
        const dataIso = new Date(dataValor).toISOString();
        const agoraIso = new Date().toISOString();

        const payloadPedido = {
          NUMERO_PEDIDO: numeroPedidoFormatado,
          NUMERO_SEQUENCIAL: numeroSequencial,
          DATA: dataIso,
          DATA_ATUALIZACAO: agoraIso,
          CLIENTE_ID: clienteId,
          ENDERECO: endereco||null,
          NUMERO: numero||null,
          COMPLEMENTO: complemento||null,
          BAIRRO: bairro||null,
          CIDADE: cidade||null,
          CEP: cep||null,
          FORMA_PAGAMENTO: pagamento || null,
          FORMA_ENTREGA: entrega || null,
          OBSERVACAO: observacao || null,
          VALOR_TOTAL: valorTotal,
          STATUS: statusSelecionado || 'NOVO',
          NOTIFICADO: true
        };

        const resPedido = await restRequest('PEDIDOS','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payloadPedido)});
        if (!Array.isArray(resPedido) || resPedido.length!==1) throw new Error('O Supabase não confirmou a criação do pedido.');
        const novoPedidoId = getValue(resPedido[0],['id','ID'],null);

        // 3. Insere os itens do pedido
        for (const item of itensValidos) {
          const payloadItem = {
            PEDIDO_ID: novoPedidoId,
            PRODUTO_ID: item.produtoId,
            QUANTIDADE: Number(item.quantidade),
            PRECO_UNITARIO: Number(item.preco),
            VALOR_ITEM: Number(item.quantidade)*Number(item.preco)
          };
          await restRequest('ITENS_PEDIDO','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payloadItem)});
        }

        modal.remove(); document.body.classList.remove('modal-open');
        showToast('Pedido criado!','Pedido #'+numeroPedidoFormatado+' lançado com sucesso.');
        filtroPedidosAtivo = 'TODOS';
        await carregarPedidos(false, false);
        renderPedidosModule();
      } catch (error) {
        console.error('Erro ao salvar pedido manual:', error);
        showToast('Erro ao salvar', error.message || 'Não foi possível criar o pedido.');
        button.disabled = false; button.textContent = '💾 Salvar pedido';
      }
    }

    /* =====================================================
       CRUD DOS MÓDULOS
    ====================================================== */
    const CRUD_TABLES = {
      'Produtos': { table:'PRODUTOS', icon:'🍪', fields:['NOME','DESCRICAO','PRECO','ATIVO'] },
      'Clientes': { table:'CLIENTES', icon:'👥', fields:['NOME','TELEFONE','WHATSAPP','CEP','ENDERECO','NUMERO','COMPLEMENTO','BAIRRO','CIDADE'] },
      'Formas de pagamento': { table:'FORMAS_PAGAMENTO', icon:'💳', fields:['NOME','ATIVO'] },
      'Formas de entrega': { table:'FORMAS_ENTREGA', icon:'🛵', fields:['NOME','VALOR','ATIVO'] },
      'Cupons': { table:'CUPONS', icon:'🎟️', fields:['CODIGO','TIPO_DESCONTO','VALOR_DESCONTO','DATA_INICIO','DATA_FIM','ATIVO','OBSERVACAO'] }
    };

    const TIPO_DESCONTO_OPCOES = [
      { value:'PERCENTUAL', label:'Percentual (%)' },
      { value:'VALOR_FIXO', label:'Valor fixo (R$)' }
    ];

    const KUKI_STORAGE_BUCKET = 'produtos';
    const MAX_PRODUTO_IMAGEM_BYTES = 5 * 1024 * 1024;
    const crudCache = {};

    function normKey(k){ return String(k||'').toUpperCase(); }
    function prettyField(k){ return String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
    function isSystemField(k){ return ['ID','CREATED_AT','UPDATED_AT','CRIADO_EM'].includes(normKey(k)); }
    function isBoolField(k){ return ['ATIVO','ABERTO','DISPONIVEL','HABILITADO'].includes(normKey(k)); }
    function isNumberField(k){ return ['PRECO','VALOR','TOTAL','TAXA','ESTOQUE','QUANTIDADE'].some(x=>normKey(k).includes(x)); }
    function isSelectField(k){ return normKey(k)==='TIPO_DESCONTO'; }
    function selectOptionsFor(k){ return isSelectField(k) ? TIPO_DESCONTO_OPCOES : []; }
    function isDateField(k){ return ['DATA_INICIO','DATA_FIM'].includes(normKey(k)); }
    function formatDateBR(v){
      const s=String(v||'').slice(0,10);
      const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m?(m[3]+'/'+m[2]+'/'+m[1]):(v??'');
    }
    function isImageField(k){ const n=normKey(k); return n.includes('IMAGEM') || n.includes('FOTO') || n.includes('IMAGE') || n.includes('PICTURE'); }
    function encontrarCampoImagem(fields){ return (fields||[]).find(isImageField) || null; }

    async function carregarCrud(name){ const cfg=CRUD_TABLES[name]; if(!cfg)return[]; try{const rows=await getTable(cfg.table,'?select=*');crudCache[name]=Array.isArray(rows)?rows:[];return crudCache[name];}catch(e){console.error(e);throw e;} }
    function crudFields(name,rows){ const cfg=CRUD_TABLES[name],set=new Set(cfg.fields); (rows||[]).forEach(r=>Object.keys(r||{}).forEach(k=>{if(!isSystemField(k))set.add(k)})); return [...set]; }
    function getRecordIdInfo(record){
      const row = record || {};
      const field = Object.keys(row).find(k => String(k).toUpperCase() === 'ID');
      if (!field || row[field] === null || row[field] === undefined) return null;
      return { field, value: row[field] };
    }

    function renderImagemCelula(url){
      const valor=String(url||'').trim();
      if(!valor) return '<span style="color:var(--cinza);">Sem foto</span>';
      return '<img class="product-thumb" src="'+escapeHtml(valor)+'" alt="Foto do produto" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline\';"><span style="display:none;color:var(--cinza);">Foto indisponível</span>';
    }

    function renderCampoCrud(f, imageField){
      if(imageField && normKey(f)===normKey(imageField)){
        return '<label class="crud-field">'+escapeHtml(prettyField(f))+'<div class="product-image-upload">'+
          '<input type="file" name="__imagem_arquivo__" accept="image/jpeg,image/png,image/webp,image/gif">'+
          '<div class="product-image-preview" id="crudImagePreview"><small>Nenhuma foto nova selecionada. Você poderá substituir a foto atual.</small></div>'+
          '<label class="product-image-remove"><input type="checkbox" name="__remover_imagem__"> Remover a foto atual</label>'+
          '</div></label>';
      }
      if(isSelectField(f)){
        const opts=selectOptionsFor(f).map(o=>'<option value="'+escapeHtml(o.value)+'">'+escapeHtml(o.label)+'</option>').join('');
        return '<label class="crud-field">'+escapeHtml(prettyField(f))+'<select name="'+escapeHtml(f)+'"><option value="">Selecione</option>'+opts+'</select></label>';
      }
      if(isDateField(f)){
        const rotulos={DATA_INICIO:'Válido a partir de (opcional)',DATA_FIM:'Válido até (opcional)'};
        const rotulo=rotulos[normKey(f)]||prettyField(f);
        return '<label class="crud-field">'+escapeHtml(rotulo)+'<input type="date" name="'+escapeHtml(f)+'"><small style="font-weight:400;color:var(--cinza);">Deixe em branco para não limitar</small></label>';
      }
      const type=isBoolField(f)?'checkbox':(isNumberField(f)?'number':'text');
      const step=isNumberField(f)?' step="0.01"':'';
      const styleExtra=normKey(f)==='CODIGO'?' style="text-transform:uppercase"':'';
      return type==='checkbox'?'<label class="crud-field check-field"><input type="checkbox" name="'+escapeHtml(f)+'" checked> '+escapeHtml(prettyField(f))+'</label>':'<label class="crud-field">'+escapeHtml(prettyField(f))+'<input'+step+styleExtra+' type="'+type+'" name="'+escapeHtml(f)+'"></label>';
    }

    function pedidosDoCupom(codigo){
      const alvo=String(codigo||'').trim().toUpperCase(); if(!alvo)return[];
      return (Array.isArray(pedidosCache)?pedidosCache:[]).filter(p=>{
        const c=getValue(p,['CUPOM_CODIGO','cupom_codigo'],'');
        return String(c||'').trim().toUpperCase()===alvo;
      });
    }

    function formatCrudCellValue(k,r){
      const v=r[k];
      if(isSelectField(k)){
        const opt=selectOptionsFor(k).find(o=>o.value===v);
        return opt?opt.label:(v??'');
      }
      if(normKey(k)==='VALOR_DESCONTO'){
        const tipoKey=Object.keys(r).find(kk=>normKey(kk)==='TIPO_DESCONTO');
        const tipo=tipoKey?r[tipoKey]:'';
        const num=Number(v);
        if(isNaN(num))return v??'';
        return tipo==='PERCENTUAL'?(num+'%'):('R$ '+num.toFixed(2).replace('.',','));
      }
      if(isDateField(k)) return v?formatDateBR(v):'—';
      return isBoolField(k)?(v?'Sim':'Não'):(v??'');
    }

    async function renderCrudModule(name){
      const c=document.getElementById('moduleContent'),cfg=CRUD_TABLES[name]; if(!cfg)return;
      c.innerHTML='<div class="module-panel"><div class="module-toolbar"><div><h2>'+cfg.icon+' '+escapeHtml(name)+'</h2><p style="color:var(--cinza);margin-top:6px;">Carregando dados...</p></div></div></div>';
      let rows=[],loadError=''; try{rows=await carregarCrud(name)}catch(e){loadError='Não foi possível carregar '+cfg.table+': '+(e.message||'erro desconhecido')}
      const fields=crudFields(name,rows), imageField=name==='Produtos'?encontrarCampoImagem(fields):null;
      const cols=rows.length?Object.keys(rows[0]).filter(k=>!isSystemField(k)):fields;
      const cupomExtra=name==='Cupons';
      const form=fields.map(f=>renderCampoCrud(f,imageField)).join('');
      const header=cols.map(k=>'<th>'+escapeHtml(prettyField(k))+'</th>').join('')+(cupomExtra?'<th>Pedido(s) que usaram</th>':'');
      const body=rows.length?rows.map((r,i)=>{
        const celulaExtra=cupomExtra?(()=>{
          const codigoKey=Object.keys(r).find(k=>normKey(k)==='CODIGO');
          const pedidos=pedidosDoCupom(codigoKey?r[codigoKey]:'');
          if(!pedidos.length)return '<td style="color:var(--cinza);">—</td>';
          const lista=pedidos.map(p=>'#'+escapeHtml(String(getValue(p,['NUMERO_PEDIDO','numero_pedido'],getPedidoId(p))))).join(', ');
          return '<td>'+lista+'</td>';
        })():'';
        return '<tr>'+cols.map(k=>'<td>'+((imageField&&normKey(k)===normKey(imageField))?renderImagemCelula(r[k]):escapeHtml(String(formatCrudCellValue(k,r))))+'</td>').join('')+celulaExtra+'<td><div class="actions-inline"><button type="button" class="secondary-button" data-crud-action="edit" data-crud-name="'+escapeHtml(name)+'" data-crud-index="'+i+'">✏️ Editar</button><button type="button" class="danger-button" data-crud-action="delete" data-crud-name="'+escapeHtml(name)+'" data-crud-index="'+i+'">🗑 Excluir</button></div></td></tr>';
      }).join(''):'<tr><td colspan="'+(cols.length+1+(cupomExtra?1:0))+'">Nenhum registro encontrado. Clique em Novo para cadastrar.</td></tr>';
      const avisoImagem=name==='Produtos'?(imageField?'<p style="margin-top:8px;color:var(--cinza);font-size:12px;">📷 Fotos armazenadas no Supabase Storage. O campo <strong>'+escapeHtml(imageField)+'</strong> guarda a URL da imagem.</p>':'<p style="margin-top:8px;color:#a20c23;font-size:12px;">⚠️ Não foi identificado automaticamente um campo de foto/imagem na tabela PRODUTOS. Crie um campo com nome contendo FOTO ou IMAGEM.</p>'):'';
      c.innerHTML='<div class="module-panel"><div class="module-toolbar"><div><h2>'+cfg.icon+' '+escapeHtml(name)+'</h2><p style="color:var(--cinza);margin-top:6px;">Visualize, cadastre, edite ou exclua informações.</p>'+avisoImagem+'</div><div class="actions-inline"><button class="primary-button" data-crud-action="new" data-crud-name="'+escapeHtml(name)+'">＋ Novo</button><button class="secondary-button" data-crud-action="refresh" data-crud-name="'+escapeHtml(name)+'">↻ Atualizar</button></div></div>'+(loadError?'<p style="color:#a20c23">'+escapeHtml(loadError)+'</p>':'')+'<div id="crudFormBox" class="crud-form-box" style="display:none"><h3 id="crudFormTitle">Novo cadastro</h3><form id="crudForm"><div class="crud-grid">'+form+'</div><div class="crud-actions"><button type="submit" class="primary-button">💾 Salvar</button><button type="button" class="secondary-button" data-crud-action="cancel">Cancelar</button></div></form></div><div class="table-wrap"><table class="data-table"><thead><tr>'+header+'<th>Ações</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
      const f=document.getElementById('crudForm');
      if(f){
        f.dataset.imageField=imageField||'';
        f.addEventListener('submit',e=>salvarCrud(e,name));
        const input=f.elements['__imagem_arquivo__'];
        if(input) input.addEventListener('change',()=>atualizarPreviewImagemSelecionada(input));
      }
    }

    function atualizarPreviewImagemSelecionada(input){
      const preview=document.getElementById('crudImagePreview'); if(!preview)return;
      const file=input && input.files ? input.files[0] : null;
      if(!file){preview.innerHTML='<small>Nenhuma foto nova selecionada.</small>';return;}

    function mostrarPreviewImagemAtual(url){
      const preview=document.getElementById('crudImagePreview'); if(!preview)return;
      if(!url){preview.innerHTML='<small>Nenhuma foto cadastrada. Selecione uma imagem para adicionar.</small>';return;}

    function abrirFormularioCrud(name){
      const b=document.getElementById('crudFormBox'),f=document.getElementById('crudForm');if(!b||!f)return;
      b.style.display='block';document.getElementById('crudFormTitle').textContent='Novo cadastro';f.dataset.editIndex='';f.dataset.imagemAtual='';f.reset();

    function fecharFormularioCrud(){const b=document.getElementById('crudFormBox');if(b)b.style.display='none';}

    function editarCrud(name,index){
      const r=(crudCache[name]||[])[Number(index)];if(!r)return;
      abrirFormularioCrud(name);document.getElementById('crudFormTitle').textContent='Editar cadastro';
      const f=document.getElementById('crudForm');f.dataset.editIndex=String(index);
      const imageField=f.dataset.imageField||encontrarCampoImagem(Object.keys(r));
      const imageUrl=imageField?getValue(r,[imageField],''):'';f.dataset.imagemAtual=imageUrl||'';
      Object.keys(r).forEach(k=>{
        if(imageField&&normKey(k)===normKey(imageField))return;
        const el=f.elements[k];if(el){if(el.type==='checkbox')el.checked=!!r[k];else el.value=r[k]??'';}

    function collectCrudForm(form){
      const obj={};Array.from(form.elements).forEach(el=>{
        if(!el.name || el.name.startsWith('__'))return;
        let v=el.type==='checkbox'?el.checked:el.value.trim();
        if(typeof v==='string' && normKey(el.name)==='CODIGO') v=v.toUpperCase();
        if(v!==''||el.type==='checkbox')obj[el.name]=isNumberField(el.name)&&v!==''?Number(String(v).replace(',','.')):v;
      });return obj;
    }

    async function uploadImagemProduto(file, registroId){
      if(!file)return null;
      if(!file.type || !file.type.startsWith('image/'))throw new Error('O arquivo selecionado não é uma imagem válida.');
      if(file.size>MAX_PRODUTO_IMAGEM_BYTES)throw new Error('A foto deve ter no máximo 5 MB.');
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const id=String(registroId||Date.now()).replace(/[^a-zA-Z0-9_-]/g,'');
      const path='produtos/'+id+'-'+Date.now()+'.'+ext;
      const {error}=await supabaseClient.storage.from(KUKI_STORAGE_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
      if(error)throw new Error('Não foi possível enviar a foto para o Supabase Storage: '+error.message);
      const publicData=supabaseClient.storage.from(KUKI_STORAGE_BUCKET).getPublicUrl(path);
      const url=publicData&&publicData.data?publicData.data.publicUrl:'';
      if(!url)throw new Error('A foto foi enviada, mas o Supabase não retornou a URL pública.');
      return url;
    }

    function montarPayloadCrudEdicao(form, registro){
      const payload = {};
      const campos = Array.from(form.elements).filter(el => el.name && !el.name.startsWith('__'));
      const chavesReais = Object.keys(registro || {});
      campos.forEach(el => {
        const chaveReal = chavesReais.find(k => String(k).toLowerCase() === String(el.name).toLowerCase());
        if (!chaveReal || isSystemField(chaveReal)) return;
        let valor;
        if (el.type === 'checkbox') valor = !!el.checked;
        else {
          valor = el.value.trim();
          if (normKey(chaveReal) === 'CODIGO') valor = valor.toUpperCase();
          if (isNumberField(chaveReal) && valor !== '') valor = Number(String(valor).replace(',', '.'));
          if (isDateField(chaveReal) && valor === '') valor = null;
        }
        payload[chaveReal] = valor;
      });
      return payload;
    }

    async function verificarEdicaoCrud(cfg, idInfo, payload){
      const consulta = '?select=*&'+encodeURIComponent(idInfo.field)+'=eq.'+encodeURIComponent(idInfo.value);
      const rows = await restRequest(cfg.table, consulta);
      if (!Array.isArray(rows) || rows.length !== 1) throw new Error('Não foi possível confirmar o registro após a alteração.');
      const atual = rows[0];
      const divergencias = Object.keys(payload).filter(chave => {
        const esperado = payload[chave], recebido = atual[chave];
        if (esperado === null || esperado === '') return recebido !== esperado && String(recebido ?? '') !== '';
        if (typeof esperado === 'number') return Number(recebido) !== esperado;
        if (typeof esperado === 'boolean') return Boolean(recebido) !== esperado;
        return String(recebido ?? '') !== String(esperado);
      });
      if (divergencias.length) throw new Error('O Supabase não confirmou a alteração dos campos: '+divergencias.join(', '));
      return atual;
    }

    async function salvarCrud(e,name){
      e.preventDefault();
      const cfg=CRUD_TABLES[name], form=e.currentTarget, idx=form.dataset.editIndex, editing=idx!=='';
      const registroEdicao = editing ? (crudCache[name]||[])[Number(idx)] : null;
      const imageField = name==='Produtos' ? (form.dataset.imageField||encontrarCampoImagem(Object.keys(registroEdicao||{}))) : null;
      const imageInput = form.elements['__imagem_arquivo__'];
      const removeImage = !!(form.elements['__remover_imagem__'] && form.elements['__remover_imagem__'].checked);
      const body = editing ? montarPayloadCrudEdicao(form, registroEdicao) : collectCrudForm(form);
      if(!confirm(editing?'Confirmar as alterações deste cadastro?':'Confirmar a inclusão deste novo cadastro?')) return;
      const botaoSalvar=form.querySelector('button[type="submit"]');if(botaoSalvar){botaoSalvar.disabled=true;botaoSalvar.textContent='Salvando...';}
      try{
        if(name==='Produtos' && !imageField && ((imageInput&&imageInput.files&&imageInput.files.length)||removeImage)) throw new Error('O campo da foto/imagem não foi identificado na tabela PRODUTOS.');
        if(editing){
          const idInfo=getRecordIdInfo(registroEdicao);if(!idInfo)throw new Error('Registro sem ID');
          if(name==='Produtos' && imageField){
            if(imageInput&&imageInput.files&&imageInput.files[0]) body[Object.keys(registroEdicao).find(k=>normKey(k)===normKey(imageField))||imageField]=await uploadImagemProduto(imageInput.files[0],idInfo.value);
            else if(removeImage) body[Object.keys(registroEdicao).find(k=>normKey(k)===normKey(imageField))||imageField]='';
          }
          if(!Object.keys(body).length)throw new Error('Nenhuma alteração foi informada.');
          const result=await restRequest(cfg.table,'?'+encodeURIComponent(idInfo.field)+'=eq.'+encodeURIComponent(String(idInfo.value)),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
          if(!Array.isArray(result)||result.length!==1)throw new Error('Nenhum registro foi atualizado. Verifique as permissões do Supabase.');
          const registroConfirmado=await verificarEdicaoCrud(cfg,idInfo,body);if(crudCache[name])crudCache[name][Number(idx)]=registroConfirmado;
        }else{
          const result=await restRequest(cfg.table,'',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
          if(!Array.isArray(result)||result.length<1)throw new Error('O cadastro não foi retornado pelo Supabase.');
          if(name==='Produtos' && imageField && imageInput&&imageInput.files&&imageInput.files[0]){
            const novo=result[0],idInfo=getRecordIdInfo(novo);if(!idInfo)throw new Error('Produto criado, mas não foi possível identificar o ID para salvar a foto.');
            const url=await uploadImagemProduto(imageInput.files[0],idInfo.value);
            const imageReal=Object.keys(novo).find(k=>normKey(k)===normKey(imageField))||imageField;
            await restRequest(cfg.table,'?'+encodeURIComponent(idInfo.field)+'=eq.'+encodeURIComponent(String(idInfo.value)),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({[imageReal]:url})});
          }
        }
        showToast('Sucesso',name==='Produtos'?'Produto salvo com sucesso. A foto está no Supabase.':(editing?'Alterações salvas e confirmadas no banco.':'Cadastro incluído.'));
        await renderCrudModule(name);
      }catch(err){console.error('CRUD SAVE:',err);showToast('Erro','Não foi possível salvar: '+(err.message||'Erro desconhecido.'));}
      finally{if(botaoSalvar){botaoSalvar.disabled=false;botaoSalvar.textContent='💾 Salvar';}}
    }

    async function salvarEnderecoRetirada() {
      const form = document.getElementById('formEnderecoRetirada');
      if (!form) return;
      const id = String(form.dataset.id || '').trim();
      const nome = document.getElementById('enderecoRetiradaNome').value.trim();
      const endereco = document.getElementById('enderecoRetiradaEndereco').value.trim();
      const numero = document.getElementById('enderecoRetiradaNumero').value.trim();
      const bairro = document.getElementById('enderecoRetiradaBairro').value.trim();
      const complemento = document.getElementById('enderecoRetiradaComplemento').value.trim();
      const cidade = document.getElementById('enderecoRetiradaCidade').value.trim();
      const ativo = document.getElementById('enderecoRetiradaAtivo').checked;

      if (!nome || !endereco) {
        showToast('Atenção', 'Informe pelo menos o nome da loja e o endereço.');
        return;
      }

      try {
        const atuais = await carregarEnderecosRetirada();
        if (!id && atuais.length >= 3) {
          showToast('Limite atingido', 'O KUKI permite até 3 endereços de retirada.');
          return;
        }

        const payload = {
          nome,
          endereco,
          numero: numero || null,
          bairro: bairro || null,
          complemento: complemento || null,
          cidade: cidade || null,
          ativo: false
        };

        if (ativo) {
          await restRequest('enderecos_retirada', '?ativo=eq.true', {
            method: 'PATCH',
            headers: {'Prefer':'return=minimal'},
            body: JSON.stringify({ativo:false})
          });
          payload.ativo = true;
        }

        if (id) {
          const result = await restRequest('enderecos_retirada', '?id=eq.' + encodeURIComponent(id), {
            method:'PATCH',
            headers:{'Prefer':'return=representation'},
            body:JSON.stringify(payload)
          });
          if (!Array.isArray(result) || result.length !== 1) throw new Error('Nenhum endereço foi atualizado.');
          showToast('Sucesso', 'Endereço atualizado com sucesso.');
        } else {
          const result = await restRequest('enderecos_retirada', '', {
            method:'POST',
            headers:{'Prefer':'return=representation'},
            body:JSON.stringify(payload)
          });
          if (!Array.isArray(result) || result.length < 1) throw new Error('O endereço não foi cadastrado.');
          showToast('Sucesso', 'Endereço cadastrado com sucesso.');
        }
        limparEnderecoRetiradaForm();
        await renderEnderecosRetiradaModule();
      } catch (err) {
        console.error('ENDEREÇOS RETIRADA SAVE:', err);
        showToast('Erro', 'Não foi possível salvar o endereço: ' + (err.message || 'Erro desconhecido.'));
      }
    }
