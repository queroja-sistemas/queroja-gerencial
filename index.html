    const financeiroState = {
      despesas: [],
      vendas: [],
      categorias: [],
      formas: [],
      tabelaDespesas: null,
      tabelaCategorias: null,
      tabelaFormas: null
    };

    function finField(obj, names, fallback='') {
      return getValue(obj, names, fallback);
    }

    function finColumnName(row, candidates, fallback) {
      if (!row || typeof row !== 'object') return fallback;
      const keys = Object.keys(row);
      for (const candidate of candidates) {
        const found = keys.find(k => k.toLowerCase() === String(candidate).toLowerCase());
        if (found) return found;
      }
      return fallback;
    }

    async function finResolveTable(candidates) {
      let lastError;
      for (const table of candidates) {
        try {
          await restRequest(table, '?select=*&limit=1');
          return table;
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error('Tabela financeira não encontrada.');
    }

    async function finLoad() {
      // Descobre uma única vez o nome REAL das tabelas e guarda o resultado.
      // Depois disso, listar, inserir, editar e excluir usam exatamente o mesmo nome.
      financeiroState.tabelaDespesas = await finResolveTable(['FINANCEIRO_DESPESAS','financeiro_despesas']);
      financeiroState.tabelaCategorias = await finResolveTable(['FINANCEIRO_CATEGORIAS','financeiro_categorias']);
      financeiroState.tabelaFormas = await finResolveTable(['FORMAS_PAGAMENTO','formas_pagamento']);

      const [despesas, categorias, formas, vendas] = await Promise.all([
        restRequest(financeiroState.tabelaDespesas, '?select=*'),
        restRequest(financeiroState.tabelaCategorias, '?select=*'),
        restRequest(financeiroState.tabelaFormas, '?select=*'),
        getTable('PEDIDOS', '?select=*')
      ]);

      financeiroState.despesas = Array.isArray(despesas) ? despesas : [];
      financeiroState.vendas = Array.isArray(vendas) ? vendas : [];
      financeiroState.categorias = (Array.isArray(categorias) ? categorias : []).filter(x => {
        const ativo = finField(x,['ATIVO','ativo'],true);
        return ativo !== false && ativo !== 0 && String(ativo).toLowerCase() !== 'false' && String(ativo) !== '0';
      });
      financeiroState.formas = (Array.isArray(formas) ? formas : []).filter(x => {
        const ativo = finField(x,['ATIVO','ativo'],true);
        return ativo !== false && ativo !== 0 && String(ativo).toLowerCase() !== 'false' && String(ativo) !== '0';
      });

      financeiroState.despesas.sort((a,b) => String(finDate(b)||'').localeCompare(String(finDate(a)||'')));
    }

    function finDate(row) { return finField(row,['DATA','data','CREATED_AT','created_at'],''); }
    function finValue(row) { return Number(String(finField(row,['VALOR','valor'],0)).replace(',','.')) || 0; }
    function finToday() { return localDateKey(new Date()); }
    function finId(row) {
      if (!row || typeof row !== 'object') return null;
      const field = finColumnName(row,['ID','id'],null);
      if (!field) return null;
      const value = row[field];
      if (value === null || value === undefined || String(value).trim()==='') return null;
      return {field, value};
    }

    function finCategoryName(id) {
      const row = financeiroState.categorias.find(x => String(finField(x,['ID','id']))===String(id));
      return row ? finField(row,['NOME','nome'],'-') : '-';
    }
    function finPaymentName(id) {
      const row = financeiroState.formas.find(x => String(finField(x,['ID','id']))===String(id));
      return row ? finField(row,['NOME','nome','DESCRICAO','descricao'],'-') : '-';
    }
    function finRows(startDate, endDate) {
      return financeiroState.despesas.filter(row => {
        const d=localDateKey(finDate(row));
        return d && (!startDate || d>=startDate) && (!endDate || d<=endDate);
      });
    }

    function finVendaDate(row) {
      return getValue(row,['created_at','CREATED_AT','DATA','data','data_pedido','DATA_PEDIDO'],'');
    }

    function finVendaValue(row) {
      return Number(String(getValue(row,['VALOR_TOTAL','valor_total','TOTAL','total','VALOR','valor'],0)).replace(',','.')) || 0;
    }

    function finVendasRows(startDate, endDate) {
      return financeiroState.vendas.filter(row => {
        const d=localDateKey(finVendaDate(row));
        return d && (!startDate || d>=startDate) && (!endDate || d<=endDate);
      });
    }

    function finVendaStatus(row) {
      return String(getValue(row,['STATUS','status'],'NOVO')).trim() || 'NOVO';
    }

    function finVendaDescricao(row) {
      const numero=getValue(row,['NUMERO_PEDIDO','numero_pedido','ID','id'],'-');
      const cliente=getValue(row,['CLIENTE_NOME','cliente_nome','NOME_CLIENTE','nome_cliente','NOME','nome'],'Cliente');
      return 'Pedido #'+numero+' · '+cliente;
    }

    function renderFinanceiroModule() {
      const container=document.getElementById('moduleContent');
      container.innerHTML=`<div class="module-panel"><div class="module-toolbar"><div><h2>💰 Financeiro</h2><p style="color:var(--cinza);margin-top:6px;">Acompanhe as vendas da KUKI e controle também as despesas.</p></div><div class="actions-inline"><button type="button" class="secondary-button" id="finRefresh">↻ Atualizar</button><button type="button" class="secondary-button" id="finCategories">🏷️ Categorias</button><button type="button" class="primary-button" id="finNew">＋ Nova despesa</button></div></div><div id="financeiroBody"><div class="empty-state"><div class="empty-state-icon">💰</div><strong>Carregando financeiro...</strong></div></div></div>`;
      document.getElementById('finRefresh').addEventListener('click', renderFinanceiroModule);
      document.getElementById('finCategories').addEventListener('click', finOpenCategories);
      document.getElementById('finNew').addEventListener('click', () => finOpenForm(null));
      finLoad().then(finRender).catch(err => {
        console.error('FINANCEIRO:',err);
        const body=document.getElementById('financeiroBody');
        if(body) body.innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><strong>Não foi possível carregar o Financeiro.</strong><p style="margin-top:8px;">${escapeHtml(err.message||'Erro de conexão.')}</p></div>`;
      });
    }

    function finRender() {
      const body=document.getElementById('financeiroBody'); if(!body) return;
      const today=finToday(), monthStart=today.slice(0,7)+'-01';
      const oldStart=document.getElementById('finStart')?.value;
      const oldEnd=document.getElementById('finEnd')?.value;
      const start=oldStart||monthStart, end=oldEnd||today;

      const vendasHoje=finVendasRows(today,today).reduce((s,x)=>s+finVendaValue(x),0);
      const vendasMes=finVendasRows(monthStart,today).reduce((s,x)=>s+finVendaValue(x),0);
      const despesasHoje=finRows(today,today).reduce((s,x)=>s+finValue(x),0);
      const despesasMes=finRows(monthStart,today).reduce((s,x)=>s+finValue(x),0);

      const despesas=finRows(start,end);
      const vendas=finVendasRows(start,end);
      const totalVendas=vendas.reduce((s,x)=>s+finVendaValue(x),0);
      const totalDespesas=despesas.reduce((s,x)=>s+finValue(x),0);
      const resultado=totalVendas-totalDespesas;

      const movimentos=[
        ...vendas.map(row=>({tipo:'VENDA',row,data:finVendaDate(row),valor:finVendaValue(row)})),
        ...despesas.map(row=>({tipo:'DESPESA',row,data:finDate(row),valor:finValue(row)}))
      ].sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));

      body.innerHTML=`
        <div class="financeiro-grid">
          <div class="financeiro-card positivo"><div class="label">🛒 VENDAS HOJE</div><div class="value">${formatMoney(vendasHoje)}</div><div class="hint">${finVendasRows(today,today).length} pedido(s)</div></div>
          <div class="financeiro-card negativo"><div class="label">💸 DESPESAS HOJE</div><div class="value">${formatMoney(despesasHoje)}</div><div class="hint">${finRows(today,today).length} lançamento(s)</div></div>
          <div class="financeiro-card positivo"><div class="label">📅 VENDAS DO MÊS</div><div class="value">${formatMoney(vendasMes)}</div><div class="hint">Do dia 1 até hoje</div></div>
          <div class="financeiro-card ${resultado>=0?'positivo':'negativo'}"><div class="label">📊 RESULTADO DO PERÍODO</div><div class="value">${formatMoney(resultado)}</div><div class="hint">Vendas ${formatMoney(totalVendas)} − despesas ${formatMoney(totalDespesas)}</div></div>
        </div>
        <div class="financeiro-filtros">
          <div class="field"><label>Data inicial</label><input type="date" id="finStart" value="${start}"></div>
          <div class="field"><label>Data final</label><input type="date" id="finEnd" value="${end}"></div>
          <button type="button" class="secondary-button" id="finFilter">🔎 Filtrar</button>
        </div>
        <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Categoria / Status</th><th>Pagamento</th><th>Valor</th><th>Ações</th></tr></thead><tbody>
        ${movimentos.length ? movimentos.map(m => {
          if(m.tipo==='VENDA'){
            const row=m.row;
            const pagamento=finField(row,['FORMA_PAGAMENTO','forma_pagamento','PAGAMENTO','pagamento','FORMA_PAGAMENTO_NOME','forma_pagamento_nome'],'-');
            return `<tr><td>${formatDateTime(m.data).split(',')[0]}</td><td><span class="status-pill" style="background:#eaf8ef;color:#137333">🛒 VENDA</span></td><td>${escapeHtml(finVendaDescricao(row))}</td><td>${escapeHtml(finVendaStatus(row))}</td><td>${escapeHtml(pagamento)}</td><td><strong style="color:#137333">${formatMoney(m.valor)}</strong></td><td>—</td></tr>`;
          }
          const row=m.row;
          const index=financeiroState.despesas.indexOf(row);
          return `<tr><td>${formatDateTime(m.data).split(',')[0]}</td><td><span class="status-pill" style="background:#fff0f1;color:#b00020">💸 DESPESA</span></td><td>${escapeHtml(finField(row,['DESCRICAO','descricao'],'-'))}</td><td>${escapeHtml(finField(row,['CATEGORIA','categoria'],finCategoryName(finField(row,['CATEGORIA_ID','categoria_id']))||'-'))}</td><td>${escapeHtml(finField(row,['FORMA_PAGAMENTO','forma_pagamento'],finPaymentName(finField(row,['FORMA_PAGAMENTO_ID','forma_pagamento_id']))||'-'))}</td><td><strong style="color:#b00020">${formatMoney(m.valor)}</strong></td><td><div class="actions-inline"><button type="button" class="secondary-button fin-edit" data-index="${index}">✏️ Editar</button><button type="button" class="danger-button fin-delete" data-index="${index}">🗑️ Excluir</button></div></td></tr>`;
        }).join('') : '<tr><td colspan="7">Nenhuma venda ou despesa encontrada no período.</td></tr>'}
        </tbody></table></div>`;
      document.getElementById('finFilter').addEventListener('click', finRender);
      body.querySelectorAll('.fin-edit').forEach(btn=>btn.addEventListener('click',()=>{
        const row=financeiroState.despesas[Number(btn.dataset.index)];
        if(!row) return showToast('Erro','Despesa não encontrada.');
        finOpenForm(row);
      }));
      body.querySelectorAll('.fin-delete').forEach(btn=>btn.addEventListener('click',()=>{
        const row=financeiroState.despesas[Number(btn.dataset.index)];
        if(!row) return showToast('Erro','Despesa não encontrada.');
        finDelete(row);
      }));
    }

    function finOptions(list,current,names) {
      // O select exibe o nome, mas envia o ID. A tabela FINANCEIRO_DESPESAS
      // usa chaves estrangeiras (CATEGORIA_ID / FORMA_PAGAMENTO_ID), não os nomes.
      return list.map(row=>{
        const id=finField(row,['ID','id'],'');
        const name=String(finField(row,names,'')).trim();
        const selected=String(id)===String(current)?'selected':'';
        return `<option value="${escapeHtml(String(id))}" ${selected}>${escapeHtml(name)}</option>`;
      }).join('');
    }

    /* =====================================================
       FINANCEIRO - CATEGORIAS (CRUD)
    ====================================================== */
    async function finReloadCategories() {
      const categorias = await restRequest(financeiroState.tabelaCategorias, '?select=*');
      financeiroState.categorias = (Array.isArray(categorias) ? categorias : []).filter(x => {
        const ativo = finField(x,['ATIVO','ativo'],true);
        return ativo !== false && ativo !== 0 && String(ativo).toLowerCase() !== 'false' && String(ativo) !== '0';
      });
    }

    function finOpenCategories() {
      if (!financeiroState.tabelaCategorias) {
        showToast('Aguarde','As categorias ainda estão sendo carregadas.');
        return;
      }
      document.getElementById('modalCategorias')?.remove();
      const modal=document.createElement('div');
      modal.className='modal-overlay';
      modal.id='modalCategorias';
      document.body.classList.add('modal-open');
      modal.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-header"><h2>🏷️ Categorias de despesas</h2><button type="button" class="icon-button" id="finCatClose">✕</button></div>
        <div id="finCategoriesContent"></div>
      </div>`;
      document.body.appendChild(modal);
      const close=()=>{ modal.remove(); document.body.classList.remove('modal-open'); };
      modal.querySelector('#finCatClose').addEventListener('click',close);
      modal.addEventListener('click',event=>{ if(event.target===modal) close(); });
      finRenderCategoriesManager();
    }

    function finRenderCategoriesManager() {
      const content=document.getElementById('finCategoriesContent');
      if(!content) return;
      const rows=[...financeiroState.categorias].sort((a,b)=>String(finField(a,['NOME','nome'],'')).localeCompare(String(finField(b,['NOME','nome'],''))));
      content.innerHTML=`
        <div class="actions-inline" style="justify-content:flex-end;margin-bottom:14px">
          <button type="button" class="primary-button" id="finCatNew">＋ Nova categoria</button>
        </div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Categoria</th><th>Ações</th></tr></thead><tbody>
          ${rows.length ? rows.map((row,index)=>`<tr><td>${escapeHtml(finField(row,['NOME','nome'],'-'))}</td><td><div class="actions-inline"><button type="button" class="secondary-button fin-cat-edit" data-index="${index}">✏️ Editar</button><button type="button" class="danger-button fin-cat-delete" data-index="${index}">🗑️ Excluir</button></div></td></tr>`).join('') : '<tr><td colspan="2">Nenhuma categoria cadastrada.</td></tr>'}
        </tbody></table></div>`;
      content.querySelector('#finCatNew').addEventListener('click',()=>finCategoryForm(null));
      content.querySelectorAll('.fin-cat-edit').forEach(btn=>btn.addEventListener('click',()=>finCategoryForm(rows[Number(btn.dataset.index)])));
      content.querySelectorAll('.fin-cat-delete').forEach(btn=>btn.addEventListener('click',()=>finDeleteCategory(rows[Number(btn.dataset.index)])));
    }

    function finCategoryForm(row) {
      const content=document.getElementById('finCategoriesContent');
      if(!content) return;
      const editing=!!row;
      const idInfo=editing?finId(row):null;
      if(editing&&!idInfo) return showToast('Erro','Categoria sem ID válido.');
      const name=editing?finField(row,['NOME','nome'],''):'';
      content.innerHTML=`
        <div class="field"><label>Nome da categoria</label><input type="text" id="finCatName" value="${escapeHtml(name)}" maxlength="100" placeholder="Ex.: Manutenção" required></div>
        <div class="actions-inline" style="justify-content:flex-end;margin-top:18px">
          <button type="button" class="secondary-button" id="finCatBack">Cancelar</button>
          <button type="button" class="primary-button" id="finCatSave">💾 ${editing?'Salvar alterações':'Cadastrar categoria'}</button>
        </div>`;
      content.querySelector('#finCatBack').addEventListener('click',finRenderCategoriesManager);
      content.querySelector('#finCatSave').addEventListener('click',async()=>{
        const button=content.querySelector('#finCatSave');
        const value=content.querySelector('#finCatName').value.trim();
        if(!value) return showToast('Dados obrigatórios','Informe o nome da categoria.');
        if(!confirm(editing?'Confirmar alteração desta categoria?':'Confirmar inclusão desta nova categoria?')) return;
        try {
          button.disabled=true; button.textContent='Salvando...';
          const sample=row||financeiroState.categorias[0]||{};
          const field=finColumnName(sample,['NOME','nome'],'NOME');
          const payload={}; payload[field]=value;
          if(editing) {
            const result=await restRequest(financeiroState.tabelaCategorias,'?'+encodeURIComponent(idInfo.field)+'=eq.'+encodeURIComponent(String(idInfo.value)),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
            if(!Array.isArray(result)||result.length!==1) throw new Error('Nenhuma categoria foi atualizada.');
          } else {
            const result=await restRequest(financeiroState.tabelaCategorias,'',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
            if(!Array.isArray(result)||result.length<1) throw new Error('O Supabase não retornou a nova categoria.');
          }
          await finReloadCategories();
          showToast('Sucesso',editing?'Categoria alterada com sucesso.':'Categoria cadastrada com sucesso.');
          finRenderCategoriesManager();
        } catch(e) {
          console.error('FINANCEIRO CATEGORIA SAVE:',e);
          showToast(editing?'Erro ao editar':'Erro ao cadastrar',e.message||'Não foi possível salvar a categoria.');
          button.disabled=false; button.textContent=editing?'💾 Salvar alterações':'💾 Cadastrar categoria';
        }
      });
    }

    async function finDeleteCategory(row) {
      const id=finId(row);
      if(!id) return showToast('Erro','ID da categoria não encontrado.');
      const name=finField(row,['NOME','nome'],'esta categoria');
      if(!confirm(`Excluir a categoria "${name}"? Esta ação não poderá ser desfeita.`)) return;
      try {
        await restRequest(financeiroState.tabelaCategorias,'?'+encodeURIComponent(id.field)+'=eq.'+encodeURIComponent(String(id.value)),{method:'DELETE',headers:{'Prefer':'return=representation'}});
        await finReloadCategories();
        showToast('Categoria excluída','A categoria foi removida com sucesso.');
        finRenderCategoriesManager();
      } catch(e) {
        console.error('FINANCEIRO CATEGORIA DELETE:',e);
        showToast('Erro ao excluir',e.message||'Não foi possível excluir a categoria.');
      }
    }

    function finOpenForm(row) {
      const editing=!!row;
      const idInfo=editing?finId(row):null;
      if(editing&&!idInfo) return showToast('Erro ao editar','Este lançamento não possui um ID válido.');
      const category=editing?String(finField(row,['CATEGORIA_ID','categoria_id'],'')):'';
      const payment=editing?String(finField(row,['FORMA_PAGAMENTO_ID','forma_pagamento_id'],'')):'';
      document.getElementById('modalDespesa')?.remove();
      const modal=document.createElement('div'); modal.className='modal-overlay'; modal.id='modalDespesa';
      document.body.classList.add('modal-open');
      modal.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true"><div class="modal-header"><h2>${editing?'✏️ Editar despesa':'➕ Nova despesa'}</h2><button type="button" class="icon-button" id="finClose">✕</button></div>
        <div class="field"><label>Data</label><input type="date" id="finDateInput" value="${editing?localDateKey(finDate(row)):finToday()}" required></div>
        <div class="field"><label>Descrição</label><input type="text" id="finDescription" value="${escapeHtml(editing?finField(row,['DESCRICAO','descricao'],''):'')}" required></div>
        <div class="field"><label>Categoria</label><select id="finCategory"><option value="">Selecione</option>${finOptions(financeiroState.categorias,category,['NOME','nome'])}</select></div>
        <div class="field"><label>Forma de pagamento</label><select id="finPayment"><option value="">Selecione</option>${finOptions(financeiroState.formas,payment,['NOME','nome','DESCRICAO','descricao'])}</select></div>
        <div class="field"><label>Valor</label><input type="number" step="0.01" min="0.01" id="finAmount" value="${editing?finValue(row):''}" required></div>
        <div class="field"><label>Observação</label><textarea id="finObservation">${escapeHtml(editing?finField(row,['OBSERVACAO','observacao'],''):'')}</textarea></div>
        <div class="actions-inline" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary-button" id="finCancel">Cancelar</button><button type="button" class="primary-button" id="finSave">💾 ${editing?'Salvar alterações':'Cadastrar despesa'}</button></div></div>`;
      document.body.appendChild(modal);
      const close=()=>{ modal.remove(); document.body.classList.remove('modal-open'); };
      modal.querySelector('#finClose').addEventListener('click',close);
      modal.querySelector('#finCancel').addEventListener('click',close);
      modal.addEventListener('click',(event)=>{ if(event.target===modal) close(); });
      modal.querySelector('#finSave').addEventListener('click',async()=>{
        const button=modal.querySelector('#finSave');
        try {
          const payload=finPayload(row);
          if(!confirm(editing?'Confirmar alteração desta despesa?':'Confirmar inclusão desta nova despesa?')) return;
          button.disabled=true; button.textContent='Salvando...';
          if(editing) await finUpdate(row,payload); else await finInsert(payload);
          close();
          showToast('Sucesso',editing?'Despesa alterada com sucesso.':'Despesa cadastrada com sucesso.');
          renderFinanceiroModule();
        } catch(e) {
          console.error('FINANCEIRO SAVE:',e);
          showToast(editing?'Erro ao editar':'Erro ao cadastrar',e.message||'Não foi possível salvar.');
          button.disabled=false; button.textContent=editing?'💾 Salvar alterações':'💾 Cadastrar despesa';
        }
      });
    }

    function finPayload(row) {
      const date=document.getElementById('finDateInput').value;
      const description=document.getElementById('finDescription').value.trim();
      const categoryId=document.getElementById('finCategory').value||null;
      const paymentId=document.getElementById('finPayment').value||null;
      const amount=Number(document.getElementById('finAmount').value);
      const observation=document.getElementById('finObservation').value.trim()||null;
      if(!date||!description||!(amount>0)) throw new Error('Informe data, descrição e valor válido.');

      // A estrutura real da FINANCEIRO_DESPESAS não possui CATEGORIA nem
      // FORMA_PAGAMENTO. Ela guarda os relacionamentos por *_ID.
      // Mantemos os nomes reais das demais colunas conforme o registro existente.
      const sample=row||financeiroState.despesas[0]||{};
      const put=(obj,candidates,value,fallback)=>{obj[finColumnName(sample,candidates,fallback)]=value;};
      const payload={};
      put(payload,['DATA','data'],date+'T12:00:00','DATA');
      put(payload,['DESCRICAO','descricao'],description,'DESCRICAO');
      put(payload,['CATEGORIA_ID','categoria_id'],categoryId,'CATEGORIA_ID');
      put(payload,['FORMA_PAGAMENTO_ID','forma_pagamento_id'],paymentId,'FORMA_PAGAMENTO_ID');
      put(payload,['VALOR','valor'],amount,'VALOR');
      // OBSERVACAO só é enviado se a coluna existir; assim evitamos erro de schema.
      const obsField=finColumnName(sample,['OBSERVACAO','observacao'],null);
      if(obsField) payload[obsField]=observation;
      return payload;
    }

    async function finInsert(payload) {
      const result=await restRequest(financeiroState.tabelaDespesas,'',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      if(!Array.isArray(result)||result.length<1) throw new Error('O Supabase não retornou o novo lançamento.');
      return result[0];
    }

    async function finUpdate(row,payload) {
      const id=finId(row); if(!id) throw new Error('ID do lançamento não encontrado.');
      const result=await restRequest(financeiroState.tabelaDespesas,'?'+encodeURIComponent(id.field)+'=eq.'+encodeURIComponent(String(id.value)),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)});
      if(!Array.isArray(result)||result.length!==1) throw new Error('Nenhuma despesa foi atualizada. Nenhum novo registro foi criado.');
      return result[0];
    }

    async function finDelete(row) {
      const id=finId(row); if(!id) return showToast('Erro ao excluir','ID do lançamento não encontrado.');
      if(!confirm('Excluir esta despesa? Esta ação não poderá ser desfeita.')) return;
      try {
        await restRequest(financeiroState.tabelaDespesas,'?'+encodeURIComponent(id.field)+'=eq.'+encodeURIComponent(String(id.value)),{method:'DELETE',headers:{'Prefer':'return=representation'}});
        showToast('Despesa excluída','O lançamento foi removido.'); renderFinanceiroModule();
      } catch(e) { console.error('FINANCEIRO DELETE:',e); showToast('Erro ao excluir',e.message||'Não foi possível excluir a despesa.'); }
    }
    /* =====================================================
       MENU + HISTÓRICO DO NAVEGADOR

    const ROUTE_TO_MODULE = {
      'dashboard':'Dashboard',
      'pedidos':'Pedidos',
      'financeiro':'Financeiro',
      'produtos':'Produtos',
      'clientes':'Clientes',
      'formas-de-pagamento':'Formas de pagamento',
      'formas-de-entrega':'Formas de entrega',
      'endereco-retirada':'Endereço Retirada',
      'horarios':'Horários',
      'configuracoes':'Configurações',
      'analises':'Análises',
      'relatorios':'Relatórios',
      'cupons':'Cupons'
    };
    function moduleToRoute(name){
      return Object.keys(ROUTE_TO_MODULE).find(route => ROUTE_TO_MODULE[route]===name) || 'dashboard';
    }
    function routeToModule(){
      const route=(location.hash||'#dashboard').replace(/^#/,'').trim().toLowerCase();
      return ROUTE_TO_MODULE[route] || 'Dashboard';
    }
    function updateActiveMenu(name){
      document.querySelectorAll('.menu button').forEach(item => {
        const label=item.textContent.replace(/\s+/g,' ').trim();
        item.classList.toggle('active', label.includes(name));
      });
    }
    function setMobileMenu(open){
      const menu = document.getElementById('mainMenu');
      const backdrop = document.getElementById('mobileMenuBackdrop');
      const button = document.getElementById('mobileMenuToggle');
      if (!menu || !backdrop || !button) return;
      const shouldOpen = Boolean(open) && window.matchMedia('(max-width: 760px)').matches;
      menu.classList.toggle('mobile-menu-open', shouldOpen);
      backdrop.classList.toggle('is-visible', shouldOpen);
      backdrop.setAttribute('aria-hidden', String(!shouldOpen));
      button.setAttribute('aria-expanded', String(shouldOpen));
    }
    function toggleMobileMenu(){
      const menu = document.getElementById('mainMenu');
      setMobileMenu(!menu?.classList.contains('mobile-menu-open'));
    }
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') setMobileMenu(false);
    });
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 760px)').matches) setMobileMenu(false);
    });
    function navigateToModule(name, options={}){
      const push=options.push!==false;
      const route=moduleToRoute(name);
      const targetHash='#'+route;
      if(push && location.hash!==targetHash){
        history.pushState({kukiModule:name},'',targetHash);
      } else if(!push && location.hash!==targetHash){
        history.replaceState({kukiModule:name},'',targetHash);
      }
      updateActiveMenu(name);
      abrirModulo(name);
    }
    function selectMenu(button, name) {
      // Ao abrir PEDIDOS pelo menu, sempre iniciar sem filtro de status/data.
      // Assim a tela principal mostra todos os pedidos existentes.
      if (name === 'Pedidos') filtroPedidosAtivo = 'TODOS';
      navigateToModule(name,{push:true});
      setMobileMenu(false);
    }
    function selectMenuByName(name) {
      // Acesso direto ao módulo PEDIDOS também deve mostrar todos os pedidos.
      // Os filtros continuam disponíveis apenas quando acionados pelos cards
      // do Dashboard (Pedidos Novos / Pedidos Hoje).
      if (name === 'Pedidos') filtroPedidosAtivo = 'TODOS';
      navigateToModule(name,{push:true});
    }
    function carregarModuloAtual() { abrirModulo(moduloAtual); }
    function abrirModulo(name) {
      moduloAtual = name;
      const dashboard = document.getElementById('dashboardContent');
      const moduleContent = document.getElementById('moduleContent');
      document.getElementById('pageTitle').textContent = name;
      const subtitles = {
        'Dashboard':'Visão geral da sua loja','Pedidos':'Acompanhe e gerencie todos os pedidos','Produtos':'Cadastre e gerencie os produtos da KUKI','Clientes':'Consulte os clientes cadastrados','Formas de pagamento':'Gerencie as opções de pagamento','Formas de entrega':'Gerencie as formas de entrega','Endereço Retirada':'Cadastre os endereços e defina o endereço ativo do dia','Horários':'Defina os horários de funcionamento da loja','Configurações':'Configurações gerais do sistema','Financeiro':'Acompanhe vendas, despesas e resultado financeiro','Análises':'Indicadores, tendências e inteligência da loja','Relatórios':'Relatórios exportáveis com os dados da sua loja','Cupons':'Cadastre cupons de desconto e acompanhe onde foram usados'
      };
      document.getElementById('pageSubtitle').textContent = subtitles[name] || '';
      if (name === 'Dashboard') { dashboard.style.display='block'; moduleContent.style.display='none'; atualizarDashboard(); return; }
      dashboard.style.display='none'; moduleContent.style.display='block';
      if (name === 'Horários') renderHorariosModule();
      else if (name === 'Financeiro') renderFinanceiroModule();
      else if (name === 'Pedidos') renderPedidosModule();
      else if (name === 'Endereço Retirada') renderEnderecosRetiradaModule();
      else if (name === 'Análises') renderKukiIAModule();
      else if (name === 'Relatórios') renderRelatoriosModule();
      else if (CRUD_TABLES[name]) renderCrudModule(name);
      else renderPlaceholderModule(name);
    }
    window.addEventListener('popstate', () => {
      document.getElementById('modalDespesa')?.remove();
      document.body.classList.remove('modal-open');
      const name=routeToModule();
      updateActiveMenu(name);
      abrirModulo(name);
    });
    window.addEventListener('hashchange', () => {
      const name=routeToModule();
      if(name!==moduloAtual){ updateActiveMenu(name); abrirModulo(name); }
    });
    /* =====================================================
       INICIAR - LOGIN OBRIGATÓRIO
    ====================================================== */

    // Ao atualizar (F5), o Supabase restaura a sessão existente.
    // Só exige novo login quando a sessão não existe ou passou 1 hora
    // sem qualquer interação no sistema.
    loginScreen.style.display = 'flex';
    appScreen.style.display = 'none';

    setTimeout(async () => {
      const initialModule = routeToModule();
      const route = '#' + moduleToRoute(initialModule);

      if (!location.hash) {
        history.replaceState({kukiModule:initialModule},'',route);
      }

      updateActiveMenu(initialModule);
      await verificarSessao();
    }, 0);

  </script>

</body>
</html>
