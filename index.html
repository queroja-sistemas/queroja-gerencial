<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>QueroJá Gerencial</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --vermelho: #a9001d;
      --vermelho-escuro: #820016;
      --vermelho-claro: #c31231;
      --creme: #f8eee4;
      --creme-escuro: #ead7c4;
      --branco: #ffffff;
      --texto: #352c2c;
      --cinza: #777777;
      --borda: #e8ddd3;
      --fundo: #f7f3ef;
      --verde: #1f9d55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      background:
        radial-gradient(circle at top left, #f9e7d6, transparent 35%),
        linear-gradient(135deg, #fff8f2, #ead8c8);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.97);
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 20px 60px rgba(80, 30, 30, 0.16);
      border: 1px solid var(--borda);
    }

    .login-logo {
      display: block;
      width: 210px;
      max-width: 100%;
      margin: 0 auto 10px;
    }

    .login-title {
      text-align: center;
      color: var(--vermelho);
      font-size: 30px;
      font-weight: 800;
      margin-top: 5px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--cinza);
      margin: 10px 0 30px;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--texto);
    }

    .field input, .field select, .field textarea {
      width: 100%;
      height: 52px;
      border-radius: 13px;
      border: 1px solid var(--borda);
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
      transition: 0.2s;
      font-family: inherit;
      box-sizing: border-box;
    }

    .field select {
      appearance: auto;
    }

    .field textarea {
      height: auto;
      min-height: 90px;
      padding: 12px 16px;
      resize: vertical;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--vermelho);
      box-shadow: 0 0 0 3px rgba(169, 0, 29, 0.1);
    }

    .login-button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 13px;
      background: var(--vermelho);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .login-button:hover {
      background: var(--vermelho-escuro);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      display: none;
      margin-top: 18px;
      background: #fff0f1;
      border: 1px solid #f3c4ca;
      color: #a9001d;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
    }

    /* =========================
       SISTEMA
    ========================= */

    #appScreen {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      width: 260px;
      height: 100vh;
      left: 0;
      top: 0;
      background: var(--vermelho);
      color: white;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 3px 0 20px rgba(0,0,0,0.08);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-logo {
      padding: 10px 15px 28px;
      text-align: center;
    }

    .sidebar-logo img {
      width: 160px;
      max-width: 100%;
      background: #fff8f2;
      border-radius: 14px;
      padding: 8px;
    }

    .sidebar-title {
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 8px;
      opacity: 0.85;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu button {
      width: 100%;
      border: none;
      background: transparent;
      color: white;
      text-align: left;
      padding: 14px 15px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }

    .menu button:hover,
    .menu button.active {
      background: rgba(255,255,255,0.18);
    }

    .menu button span {
      display: inline-block;
      width: 30px;
      font-size: 19px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 20px;
    }

    .user-info {
      padding: 12px 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .user-label {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 5px;
    }

    .user-email {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-button {
      width: 100%;
      border: none;
      background: rgba(0,0,0,0.18);
      color: white;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .logout-button:hover {
      background: rgba(0,0,0,0.28);
    }

    /* =========================
       CONTEÚDO
    ========================= */

    .main {
      margin-left: 260px;
      min-height: 100vh;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .page-title h1 {
      font-size: 30px;
      color: var(--vermelho);
      margin-bottom: 5px;
    }

    .page-title p {
      color: var(--cinza);
      font-size: 14px;
    }

    .date-box {
      background: white;
      border: 1px solid var(--borda);
      padding: 12px 17px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--cinza);
    }

    .dashboard {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--borda);
      box-shadow: 0 5px 18px rgba(50, 30, 20, 0.04);
    }

    .card-icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--creme);
      font-size: 22px;
      margin-bottom: 15px;
    }

    .card-label {
      font-size: 13px;
      color: var(--cinza);
      font-weight: 600;
    }

    .card-value {
      font-size: 29px;
      font-weight: 800;
      color: var(--texto);
      margin-top: 5px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
    }

    .dashboard-quick-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .panel {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel h2 {
      font-size: 19px;
      color: var(--texto);
    }

    .panel-link {
      border: none;
      background: none;
      color: var(--vermelho);
      cursor: pointer;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--cinza);
    }

    .empty-state-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .welcome {
      background:
        linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
      color: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .welcome p {
      opacity: 0.88;
      font-size: 14px;
      line-height: 1.5;
    }

    .mobile-header {
      display: none;
    }

    .mobile-menu-toggle,
    .mobile-menu-backdrop {
      display: none;
    }

    /* =========================
       BEM-VINDO / NOTIFICAÇÕES / MÓDULOS
    ========================= */
    .sidebar-welcome {
      margin: 6px 6px 22px;
      padding: 18px 15px;
      border-radius: 16px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.16);
    }
    .sidebar-welcome strong { display:block; font-size:18px; margin-bottom:6px; }
    .sidebar-welcome span { font-size:12px; line-height:1.45; opacity:.88; }

    .notification-button {
      border: 1px solid var(--borda);
      background: white;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      cursor: pointer;
      position: relative;
      font-size: 20px;
    }
    .notification-badge {
      position:absolute; right:-5px; top:-5px;
      min-width:20px; height:20px; padding:0 5px;
      border-radius:20px; background:var(--vermelho); color:#fff;
      font-size:11px; font-weight:800; display:none;
      align-items:center; justify-content:center;
      border:2px solid #fff;
    }
    .topbar-actions { display:flex; align-items:center; gap:12px; }
    .sound-toggle{
      border:1px solid var(--borda); background:#fff; color:var(--texto);
      min-height:46px; padding:0 14px; border-radius:13px; cursor:pointer;
      font-weight:800; font-size:12px; transition:.2s;
    }
    .sound-toggle:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(50,30,20,.08)}
    .sound-toggle.sound-on{border-color:#b9dfc7;background:#f1fbf4;color:#137333}
    .sound-toggle.sound-alert{animation:kukiSoundAlert .55s ease-in-out 4}
    @keyframes kukiSoundAlert{
      0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}
    }
    @media(max-width:760px){.sound-toggle{flex:1}}

    .toast-container {
      position:fixed; right:24px; top:24px; z-index:5000;
      display:flex; flex-direction:column; gap:10px; max-width:360px;
    }
    .toast {
      background:#fff; border:1px solid var(--borda); border-left:5px solid var(--vermelho);
      border-radius:14px; padding:14px 16px; box-shadow:0 14px 35px rgba(50,20,20,.18);
      animation:slideIn .25s ease;
    }
    .toast strong { display:block; color:var(--vermelho); margin-bottom:4px; }
    .toast p { color:var(--texto); font-size:13px; }
    @keyframes slideIn { from {opacity:0; transform:translateX(30px)} to {opacity:1; transform:none} }

    .module-panel { background:#fff; border:1px solid var(--borda); border-radius:18px; padding:24px; }
    .module-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .primary-button { border:none; background:var(--vermelho); color:#fff; padding:11px 16px; border-radius:10px; font-weight:800; cursor:pointer; }
    .primary-button:hover { background:var(--vermelho-escuro); }
    .table-wrap { overflow-x:auto; }

    /* FOTOS DOS PRODUTOS */
    .product-thumb {
      display:block;
      width:78px;
      height:78px;
      max-width:78px;
      max-height:78px;
      object-fit:contain;
      object-position:center;
      border:1px solid var(--borda);
      border-radius:10px;
      background:#fffaf6;
      padding:4px;
    }
    .product-image-upload {
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
      width:100%;
    }
    .product-image-preview {
      width:150px;
      min-height:110px;
      max-width:150px;
      padding:8px;
      border:1px dashed var(--borda);
      border-radius:12px;
      background:#fffaf6;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
    }
    .product-image-preview img {
      display:block;
      width:130px;
      height:130px;
      max-width:130px;
      max-height:130px;
      object-fit:contain;
      object-position:center;
      border-radius:8px;
    }
    .product-image-preview small {
      display:block;
      max-width:100%;
      overflow-wrap:anywhere;
    }
    .product-image-remove {
      display:flex;
      align-items:center;
      gap:7px;
      font-size:13px;
      font-weight:600;
      color:var(--cinza);
    }

    .data-table { width:100%; border-collapse:collapse; min-width:680px; }
    .data-table th, .data-table td { padding:13px 12px; border-bottom:1px solid var(--borda); text-align:left; font-size:14px; }
    .data-table th { color:var(--cinza); font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
    .time-input { border:1px solid var(--borda); border-radius:9px; padding:8px; color:var(--texto); }
    .switch { position:relative; display:inline-block; width:48px; height:26px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:#bbb; border-radius:30px; cursor:pointer; transition:.2s; }
    .slider:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider { background:var(--verde); }
    .switch input:checked + .slider:before { transform:translateX(22px); }
    .status-pill { display:inline-block; padding:5px 9px; border-radius:20px; background:var(--creme); color:var(--texto); font-size:12px; font-weight:700; }
    .recent-orders-list { display:grid; gap:10px; }
    .recent-order { display:flex; justify-content:space-between; gap:12px; padding:13px; border:1px solid var(--borda); border-radius:12px; }
    .recent-order strong { display:block; margin-bottom:4px; }
    .recent-order small { color:var(--cinza); }
    .empty-module { text-align:center; padding:50px 20px; color:var(--cinza); }

    /* AÇÕES DE PEDIDOS */
    .actions-cell { white-space:nowrap; }
    .action-group { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .secondary-button, .danger-button, .locked-button { border:none; padding:9px 12px; border-radius:9px; font-weight:800; cursor:pointer; font-size:12px; }
    .secondary-button { background:#eee6df; color:var(--texto); }
    .secondary-button:hover { filter:brightness(.97); }
    .danger-button { background:#a9001d; color:#fff; }
    .danger-button:hover { background:#820016; }
    .locked-button { background:#f1f1f1; color:#777; cursor:not-allowed; }
    .status-select { border:1px solid var(--borda); border-radius:9px; padding:9px 30px 9px 10px; background:#fff; min-width:165px; font-weight:700; color:var(--texto); cursor:pointer; }
    .status-menu-wrap { display:flex; flex-direction:column; gap:4px; }
    .status-menu-label { font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--cinza); font-weight:800; }
    .order-lock-note { margin-top:14px; padding:12px 14px; border-radius:10px; background:#fff7e8; border:1px solid #f0d49a; color:#7a5b17; font-size:13px; }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .sidebar {
        display: flex;
        width: min(86vw, 320px);
        padding: 22px 15px calc(22px + env(safe-area-inset-bottom));
        transform: translateX(-105%);
        transition: transform .25s ease;
        z-index: 6001;
        box-shadow: 8px 0 28px rgba(0,0,0,.25);
      }

      .sidebar.mobile-menu-open {
        transform: translateX(0);
      }

      .mobile-menu-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.42);
        opacity: 0;
        visibility: hidden;
        transition: opacity .25s ease, visibility .25s ease;
        z-index: 6000;
      }

      .mobile-menu-backdrop.is-visible {
        opacity: 1;
        visibility: visible;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--vermelho);
        padding: 13px 15px;
        border-radius: 15px;
        margin-bottom: 20px;
      }

      .mobile-header img {
        width: 110px;
        background: #fff8f2;
        padding: 5px;
        border-radius: 8px;
      }

      .mobile-header button {
        border: none;
        background: rgba(255,255,255,0.16);
        color: white;
        padding: 9px 12px;
        border-radius: 8px;
        font-weight: 700;
      }

      .mobile-header .mobile-menu-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .topbar {
        display: block;
      }

      .topbar-actions { margin-top:15px; justify-content:space-between; }
      .toast-container { right:12px; left:12px; top:12px; max-width:none; }

      .date-box {
        margin-top: 15px;
        display: inline-block;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .card {
        padding: 16px;
      }

      .card-value {
        font-size: 23px;
      }

      .login-card {
        padding: 30px 22px;
      }

      .login-title {
        font-size: 26px;
      }
    }

    @media (max-width: 430px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }
    }
  
    /* CRUD módulos */
    .crud-form-box{margin:20px 0;padding:18px;border:1px solid #ead7c7;border-radius:16px;background:#fffaf6}
    .crud-form-box h3{margin-bottom:14px}.crud-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:700}.crud-field input,.crud-field select{padding:12px;border:1px solid #d9c8bb;border-radius:10px;font:inherit;background:#fff;color:inherit}.check-field{flex-direction:row;align-items:center}.crud-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions-inline{display:flex;gap:8px;align-items:center;justify-content:flex-start;flex-wrap:nowrap}.actions-inline button{margin:0!important;min-width:92px}.crud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}.crud-grid .crud-field{margin-bottom:0}
    @media(max-width:700px){.actions-inline{gap:6px}.actions-inline button{min-width:0;padding:9px 8px;font-size:12px}.crud-grid{grid-template-columns:1fr}}

    .dashboard-card-action{
      width:100%;
      font:inherit;
      color:inherit;
      text-align:left;
      cursor:pointer;
      appearance:none;
    }
    .dashboard-card-action:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(90,55,35,.12);
    }
    .dashboard-card-action:focus-visible{
      outline:3px solid rgba(174,0,35,.28);
      outline-offset:3px;
    }
    .card-hint{
      margin-top:12px;
      font-size:.88rem;
      font-weight:600;
      color:var(--cinza);
      line-height:1.35;
    }

    .card-novos-destaque{
      position:relative;
      overflow:visible;
      border:2px solid rgba(174,0,35,.82) !important;
      animation:kukiCardPulse 1.15s ease-in-out infinite;
    }
    .card-novos-destaque::before{
      content:'';
      position:absolute;
      inset:-5px;
      border-radius:inherit;
      pointer-events:none;
      box-shadow:0 0 0 0 rgba(174,0,35,.34);
      animation:kukiRingPulse 1.15s ease-out infinite;
    }
    .card-novos-destaque.card-normalizado{
      animation:none;
      border-color:var(--borda) !important;
    }
    .card-novos-destaque.card-normalizado::before{
      animation:none;
      box-shadow:none;
    }
    .novo-alerta-pulse{
      position:absolute;
      top:16px;
      right:16px;
      width:12px;
      height:12px;
      border-radius:50%;
      background:#b00020;
      box-shadow:0 0 0 0 rgba(176,0,32,.5);
      animation:kukiDotPulse 1.15s infinite;
    }
    .card-normalizado .novo-alerta-pulse{ display:none; }
    @keyframes kukiCardPulse{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-3px); }
    }
    @keyframes kukiRingPulse{
      0%{ box-shadow:0 0 0 0 rgba(174,0,35,.34); }
      70%{ box-shadow:0 0 0 13px rgba(174,0,35,0); }
      100%{ box-shadow:0 0 0 0 rgba(174,0,35,0); }
    }
    @keyframes kukiDotPulse{
      0%{ box-shadow:0 0 0 0 rgba(176,0,32,.48); }
      70%{ box-shadow:0 0 0 10px rgba(176,0,32,0); }

    const INATIVIDADE_LIMITE_MS = 60 * 60 * 1000;

    let inactivityTimer = null;

    function salvarUltimaAtividade() {
      try { localStorage.setItem(INATIVIDADE_STORAGE_KEY, String(Date.now())); } catch(e) {}
    }

    function obterUltimaAtividade() {
      try {
        const value = Number(localStorage.getItem(INATIVIDADE_STORAGE_KEY));
        return Number.isFinite(value) && value > 0 ? value : 0;
      } catch(e) { return 0; }
    }

    function limparUltimaAtividade() {
      try { localStorage.removeItem(INATIVIDADE_STORAGE_KEY); } catch(e) {}
    }

    function mostrarMensagemSessaoExpirada() {
      const el = document.getElementById('loginError');
      if (!el) return;
      el.textContent = 'Sua sessão foi encerrada após 1 hora de inatividade. Faça login novamente.';
      el.style.display = 'block';
    }

    function programarExpiracaoInatividade() {
      if (inactivityTimer) clearTimeout(inactivityTimer);
      const ultima = obterUltimaAtividade() || Date.now();
      const restante = INATIVIDADE_LIMITE_MS - (Date.now() - ultima);
      if (restante <= 0) {
        encerrarPorInatividade();
        return;
      }
      inactivityTimer = setTimeout(encerrarPorInatividade, restante);
    }

    function registrarAtividadeUsuario() {
      if (appScreen.style.display === 'none') return;
      salvarUltimaAtividade();
      programarExpiracaoInatividade();
    }

    function iniciarMonitorInatividade() {
      salvarUltimaAtividade();
      programarExpiracaoInatividade();
    }

      if (inactivityTimer) clearTimeout(inactivityTimer);
      inactivityTimer = null;
      limparUltimaAtividade();
    }

    async function encerrarPorInatividade() {
      if (appScreen.style.display === 'none') return;

      mostrarMensagemSessaoExpirada();

      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = null;

      try {
        await supabaseClient.auth.signOut();
      } catch(e) {
        console.error('Sessão:', e);
        appScreen.style.display = 'none';
        loginScreen.style.display = 'flex';

    }

    ['pointerdown','keydown','touchstart','wheel','scroll','click'].forEach(eventName => {
      window.addEventListener(eventName, registrarAtividadeUsuario, {passive:true});

      for (const name of names) {
        const key = map[name.toLowerCase()];
        if (key !== undefined && obj[key] !== null && obj[key] !== undefined) return obj[key];
      }
      return fallback;
    }

    async function restRequest(table, path='', options={}) {
      let accessToken = SUPABASE_KEY;
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session && data.session.access_token) {
          accessToken = data.session.access_token;
        }
      } catch (e) {
        console.warn('Não foi possível obter a sessão do Supabase:', e);
      }

      // Todo INSERT (POST) precisa levar o loja_id da loja logada — as
      // tabelas ganharam essa coluna como NOT NULL na migração multi-tenant.
      // Exceção: tabelas isoladas via relação (ITENS_PEDIDO, CUPOM_USOS) não
      // têm essa coluna e não devem recebê-la.
      const method = (options.method || 'GET').toUpperCase();
      if (method === 'POST' && !TABELAS_SEM_LOJA_ID.has(table) && options.body) {
        try {
          const parsedBody = JSON.parse(options.body);
          if (Array.isArray(parsedBody)) {
            parsedBody.forEach(item => { if (item && item.loja_id === undefined) item.loja_id = MEU_LOJA_ID; });
          } else if (parsedBody && parsedBody.loja_id === undefined) {
            parsedBody.loja_id = MEU_LOJA_ID;
          }
          options = { ...options, body: JSON.stringify(parsedBody) };
        } catch (e) {
          console.warn('Não foi possível anexar loja_id ao corpo da requisição:', e);
        }
      }

      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const url = SUPABASE_URL + '/rest/v1/' + encodeURIComponent(table) + path;
      const response = await fetch(url, {...options, headers});
      const text = await response.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch(e) { body = text; }
      if (!response.ok) {
        const message = body && body.message ? body.message : (body && body.hint ? body.hint : text || 'Erro ao consultar dados.');
        throw new Error(message);
      }
      return body;
    }

    async function getTable(table, query='?select=*') {
      try { return await restRequest(table, query); }
      catch (firstError) {
        const alternative = table === table.toUpperCase() ? table.toLowerCase() : table.toUpperCase();
        if (alternative !== table) return await restRequest(alternative, query);
        throw firstError;
      }
    }

    function parseMoneyValue(value) {
      if (value === null || value === undefined || value === '') return 0;
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      let text = String(value).trim().replace(/[^\d,.-]/g, '');
      if (!text) return 0;

      const hasComma = text.includes(',');
      const hasDot = text.includes('.');

      if (hasComma && hasDot) {
        text = text.replace(/\./g, '').replace(',', '.');
      } else if (hasComma) {
        text = text.replace(',', '.');
      }

      const n = Number(text);
      return Number.isFinite(n) ? n : 0;
    }

    function formatMoney(value) {
      const n = parseMoneyValue(value);
      return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }

    function formatDateTime(value) {
      if (!value) return '';
      const d = new Date(value);
      return isNaN(d) ? String(value) : d.toLocaleString('pt-BR');
    }

    function pedidoKey(p) {
      return String(getValue(p, ['id','ID','pedido_id','PEDIDO_ID'], '')) + '|' + String(getValue(p, ['created_at','DATA','data','data_pedido','DATA_PEDIDO'], ''));
    }

    function sortPedidos(pedidos) {
      return [...pedidos].sort((a,b) => {
        const da = new Date(getValue(a,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],0)).getTime() || 0;
        const db = new Date(getValue(b,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],0)).getTime() || 0;
        return db-da;
      });
    }

    async function carregarProdutosCache() {
      try {
        const rows = await getTable('PRODUTOS', '?select=*');
        if (Array.isArray(rows)) {
          rows.forEach(p => {
            const id = getValue(p, ['id', 'ID'], null);
            const nome = getValue(p, ['nome', 'NOME', 'descricao', 'DESCRICAO', 'titulo', 'TITULO'], '');
            if (id !== null && id !== undefined && nome) {
              produtosNomeCache[String(id).trim()] = String(nome).trim();
            }
          });
        }
      } catch (e) {
        console.warn('Cache produtos:', e);

    function agruparItensPorPedido(itens) {
      const mapa = {};
      (itens || []).forEach(item => {
        if (!item || typeof item !== 'object') return;
        const chavesFk = Object.keys(item).filter(k => {
          const ku = k.toUpperCase();
          return ku.includes('PEDIDO') || ku === 'ORDER_ID' || ku === 'ID';
        });

        chavesFk.forEach(k => {
          const val = item[k];
          if (val !== null && val !== undefined && String(val).trim() !== '') {
            const str = String(val).trim();
            if (!mapa[str]) mapa[str] = [];
            if (!mapa[str].includes(item)) mapa[str].push(item);
          }
        });
      });
      return mapa;
    }

    async function carregarItensPedido() {
      try {
        const { data, error } = await supabaseClient.from('ITENS_PEDIDO').select('*');
        if (!error && Array.isArray(data) && data.length > 0) {
          itensPedidoCache = agruparItensPorPedido(data);
          return;
        }
      } catch (e) {}

      try {
        const rows = await restRequest('ITENS_PEDIDO', '?select=*');
        itensPedidoCache = agruparItensPorPedido(Array.isArray(rows) ? rows : []);
      } catch (e) {
        itensPedidoCache = {};
      }
    }

    function getItensDoPedido(pedido) {
      if (!pedido) return [];

      const idsDoPedido = Object.keys(pedido)
        .filter(k => {
          const ku = k.toUpperCase();
          return ku === 'ID' || ku.includes('PEDIDO') || ku.includes('NUMERO');
        })
        .map(k => String(pedido[k] ?? '').trim())
        .filter(Boolean);

      idsDoPedido.push(String(getPedidoId(pedido) || '').trim());
      idsDoPedido.push(String(getValue(pedido, ['NUMERO_PEDIDO', 'numero_pedido', 'id', 'ID'], '')).trim());

      for (const idCandidato of [...new Set(idsDoPedido)]) {
        if (idCandidato && itensPedidoCache[idCandidato] && itensPedidoCache[idCandidato].length > 0) {
          return itensPedidoCache[idCandidato];
        }
      }

      for (const k of Object.keys(pedido)) {
        const kl = k.toLowerCase();
        if (kl.includes('item') || kl.includes('prod') || kl.includes('carrinho') || kl === 'detalhes' || kl === 'descricao') {
          const val = pedido[k];
          if (!val) continue;
          if (Array.isArray(val) && val.length > 0) return val;
          if (typeof val === 'string' && val.trim()) {
            const s = val.trim();
            if ((s.startsWith('[') && s.endsWith(']')) || (s.startsWith('{') && s.endsWith('}'))) {
              try {
                const parsed = JSON.parse(s);
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                if (parsed && typeof parsed === 'object') {
                  const sub = getValue(parsed, ['itens', 'produtos', 'carrinho', 'items'], null);
                  if (Array.isArray(sub) && sub.length > 0) return sub;
                  return [parsed];
                }
              } catch (e) {}
            }
            if (s.includes('x ') || s.includes('\n') || s.includes(';')) {
              const linhas = s.split(/[\n;]+/).map(x => x.trim()).filter(Boolean);
              if (linhas.length > 0 && !linhas[0].toLowerCase().startsWith('http')) {
                return linhas.map(l => {
                  const match = l.match(/^(\d+)\s*x\s*(.+)/i);
                  if (match) return { quantidade: match[1], produto_nome: match[2].trim() };
                  return { quantidade: 1, produto_nome: l };
                });
              }
            }
          }
        }
      }

      return [];
    }

    function obterNomeDoItem(item) {
      if (!item) return 'Item';
      if (typeof item === 'string') return item;

      const camposNome = [
        'produto_nome', 'PRODUTO_NOME',
        'nome_produto', 'NOME_PRODUTO',
        'nome', 'NOME',
        'descricao', 'DESCRICAO',
        'descricao_produto', 'DESCRICAO_PRODUTO',
        'sabor', 'SABOR',
        'titulo', 'TITULO',
        'item', 'ITEM'
      ];

      for (const campo of camposNome) {
        const val = item[campo];
        if (val && typeof val === 'string' && isNaN(Number(val.trim())) && val.trim().toLowerCase() !== 'item') {
          return val.trim();
        }
      }

      const camposId = [
        'produto_id', 'PRODUTO_ID',
        'id_produto', 'ID_PRODUTO',
        'produto', 'PRODUTO',
        'item_id', 'ITEM_ID'
      ];

      for (const campo of camposId) {
        const idProd = item[campo];
        if (idProd !== null && idProd !== undefined && String(idProd).trim() !== '') {
          const idStr = String(idProd).trim();
          if (produtosNomeCache[idStr]) {
            return produtosNomeCache[idStr];
          }
        }
      }

      for (const [k, v] of Object.entries(item)) {
        if (typeof v === 'string' && v.trim().length > 1 && isNaN(Number(v.trim()))) {
          const kl = k.toLowerCase();
          if (!kl.includes('obs') && !kl.includes('date') && !kl.includes('data') && !kl.includes('id') && v.trim().toLowerCase() !== 'item') {
            return v.trim();
          }
        }
      }

      return 'Item';
    }

    function renderItensPedidoCelula(pedido) {
      const itens = getItensDoPedido(pedido);
      if (!itens || !itens.length) return '<span style="color:var(--cinza);font-size:12px;">Sem itens</span>';
      const linhas = itens.map(item => {
        if (typeof item === 'string') return '<li>' + escapeHtml(item) + '</li>';
        const nome = obterNomeDoItem(item);
        const qtd = Number(getValue(item, [
          'quantidade', 'QUANTIDADE',
          'qtd', 'QTD',
          'quant', 'QUANT',
          'qnt', 'QNT'
        ], '1')) || 1;

        const obs = getValue(item, [
          'observacao', 'OBSERVACAO',
          'obs', 'OBS',
          'observacoes', 'OBSERVACOES',
          'detalhes', 'DETALHES'
        ], '');

        return '<li><strong>' + qtd + 'x</strong> ' + escapeHtml(nome) + (obs ? ' <span style="color:var(--cinza);">(' + escapeHtml(obs) + ')</span>' : '') + '</li>';
      }).join('');

      return '<ul style="margin:0;padding-left:16px;font-size:12px;line-height:1.5;">' + linhas + '</ul>';
    }

    async function carregarPedidos(initial=false, notificarNovos=true) {
      try {
        const [rows] = await Promise.all([
          getTable('PEDIDOS', '?select=*'),
          carregarItensPedido(),
          carregarProdutosCache(),
          carregarClientesCache()
        ]);
        const novosDados = Array.isArray(rows) ? sortPedidos(rows) : [];

        if (initial) {
          pedidosConhecidos = new Set(novosDados.map(pedidoKey));
        } else if (notificarNovos) {
          const novos = novosDados.filter(p => {
            const chave = pedidoKey(p);
            return chave && !pedidosConhecidos.has(chave);
          });
          if (novos.length) notificarNovoPedido(novos.length, novos[0]);
          novosDados.forEach(p => pedidosConhecidos.add(pedidoKey(p)));
        } else {
          novosDados.forEach(p => pedidosConhecidos.add(pedidoKey(p)));
        }

        pedidosCache = novosDados;
        ultimoPedidoChave = pedidosCache[0] ? pedidoKey(pedidosCache[0]) : null;
        atualizarDashboard();

        const elementoAtivo = document.activeElement;
        const janelaPedidosInterativaAberta =
          elementoAtivo &&
          (elementoAtivo.matches('.status-select') ||
           elementoAtivo.closest('.status-menu-wrap'));

        if (moduloAtual === 'Pedidos' && !janelaPedidosInterativaAberta) {
          renderPedidosModule();

        if (recentOrders) recentOrders.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><strong>Não foi possível carregar os pedidos.</strong><p style="margin-top:8px;">Confira o acesso à tabela PEDIDOS.</p></div>';
      }
    }

    async function processarPedidoRealtime(pedido) {
      if (!pedido) return;
      const chave = pedidoKey(pedido);
      if (!chave || pedidosConhecidos.has(chave)) return;

      pedidosConhecidos.add(chave);
      pedidosCache = sortPedidos([pedido, ...pedidosCache]);
      atualizarDashboard();

      const elementoAtivo = document.activeElement;
      const janelaPedidosInterativaAberta =
        elementoAtivo &&
        (elementoAtivo.matches('.status-select') ||
         elementoAtivo.closest('.status-menu-wrap'));

      if (moduloAtual === 'Pedidos' && !janelaPedidosInterativaAberta) {
        renderPedidosModule();
      }

      notificarNovoPedido(1, pedido);
      await carregarPedidos(false, false);
    }

    function criarCanalRealtimePedidos(nomeCanal, tabela) {
      return supabaseClient
        .channel(nomeCanal)
        .on('postgres_changes', {
          event: '*', 
          schema: 'public',
          table: tabela
        }, async (payload) => {
          if (payload.eventType === 'INSERT') {
            await processarPedidoRealtime(payload && payload.new ? payload.new : null);
          } else if (payload.eventType === 'UPDATE' && payload.new) {
            const id = payload.new.id || payload.new.ID;
            const indice = pedidosCache.findIndex(p => String(getPedidoId(p)) === String(id));
            
            if (indice >= 0) {
              pedidosCache[indice] = {...pedidosCache[indice], ...payload.new};
              atualizarDashboard(); 
              
              const elementoAtivo = document.activeElement;
              const janelaPedidosInterativaAberta =
                elementoAtivo &&
                (elementoAtivo.matches('.status-select') ||
                 elementoAtivo.closest('.status-menu-wrap'));

              if (moduloAtual === 'Pedidos' && !janelaPedidosInterativaAberta) {
                renderPedidosModule();
              }
            }
          }
        });
    }

    async function iniciarRealtimePedidos() {
      if (pedidosRealtimeChannel || pedidosRealtimeChannelLower) return;

      pedidosRealtimeChannel = criarCanalRealtimePedidos('kuki-pedidos-realtime-upper', 'PEDIDOS')
        .subscribe((status) => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            showToast('Realtime', 'Tentando conexão alternativa para atualização dos pedidos.');
          }
        });

      pedidosRealtimeChannelLower = criarCanalRealtimePedidos('kuki-pedidos-realtime-lower', 'pedidos')
        .subscribe((status) => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            console.warn('Realtime minúsculo indisponível. O polling continuará ativo.');
          }
        });
    }

    async function pararRealtimePedidos() {
      if (pedidosRealtimeChannel) {
        try { await supabaseClient.removeChannel(pedidosRealtimeChannel); } catch (e) { console.error('Realtime:', e); }
      }
      if (pedidosRealtimeChannelLower) {
        try { await supabaseClient.removeChannel(pedidosRealtimeChannelLower); } catch (e) { console.error('Realtime:', e); }
      }
      pedidosRealtimeChannel = null;
      pedidosRealtimeChannelLower = null;
    }

      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!kukiAudioContext) kukiAudioContext = new AudioCtx();
        return kukiAudioContext;

    async function prepararAudio() {
      const ctx = obterAudioContext();

        if (ctx.state !== 'running') return null;

    function tocarNota(ctx, frequencia, inicio, duracao, volume=0.11) {
      const agora = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(frequencia, agora + inicio);
      gain.gain.setValueAtTime(0.0001, agora + inicio);
      gain.gain.exponentialRampToValueAtTime(volume, agora + inicio + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, agora + inicio + duracao);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(agora + inicio);
      osc.stop(agora + inicio + duracao + 0.03);
    }

    function formatPercent(v) {
      if(!isFinite(v)) return '—';

    }

    function trendText(current,previous,label) {

    function renderSalesChart(rows) {
      const el=document.getElementById('salesChart'); if(!el)return;
      if(!rows.length||rows.every(r=>r.value===0)){el.innerHTML='<div class="chart-empty">Ainda não há faturamento suficiente para desenhar o gráfico.</div>';return;}
      const w=800,h=220,pad=18,max=Math.max(...rows.map(r=>r.value),1);
      const pts=rows.map((r,i)=>{const x=pad+i*(w-pad*2)/Math.max(rows.length-1,1);const y=h-pad-(r.value/max)*(h-pad*2);return [x,y];});
      const line=pts.map(p=>p.join(',')).join(' ');
      const area='M '+pts[0][0]+' '+(h-pad)+' L '+pts.map(p=>p.join(' ')).join(' L ')+' L '+pts[pts.length-1][0]+' '+(h-pad)+' Z';
      const grid=[.25,.5,.75].map(v=>{const y=h-pad-(h-pad*2)*v;return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="#eadfd6" stroke-width="1"/>';}).join('');
      const dots=pts.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#a9001d"><title>'+escapeHtml(rows[i].label)+': '+escapeHtml(formatMoney(rows[i].value))+'</title></circle>').join('');
      el.innerHTML='<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+grid+'<path d="'+area+'" fill="#f8eee4" opacity=".85"></path><polyline points="'+line+'" fill="none" stroke="#a9001d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>'+dots+'</svg>';
      const s=document.getElementById('chartStartLabel'),e=document.getElementById('chartEndLabel');if(s)s.textContent=rows[0].label;if(e)e.textContent=rows[rows.length-1].label;
    }

      box.innerHTML=items.slice(0,4).map(x=>'<div class="insight-item"><strong>'+escapeHtml(x[0])+'</strong>'+escapeHtml(x[1])+'</div>').join('');

    async function calcularDashboardAnalytics(days){
      const current=pedidosNoPeriodo(days), ps=new Date();ps.setHours(0,0,0,0);ps.setDate(ps.getDate()-days);
      const pe=new Date(ps);pe.setDate(pe.getDate()+days);
      const previous=pedidosCache.filter(p=>{const d=new Date(getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],''));return !isNaN(d)&&d>=ps&&d<pe;});
      const revenue=current.reduce((s,p)=>s+getPedidoTotal(p),0),prevRevenue=previous.reduce((s,p)=>s+getPedidoTotal(p),0);
      const ticket=current.length?revenue/current.length:0,prevTicket=previous.length?prevRevenue/previous.length:0;
      const revenueTrend=prevRevenue?((revenue-prevRevenue)/prevRevenue)*100:null,ordersTrend=previous.length?((current.length-previous.length)/previous.length)*100:null,ticketTrend=prevTicket?((ticket-prevTicket)/prevTicket)*100:null;
      const daily={};current.forEach(p=>{const d=new Date(getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],''));const k=localDateKey(d);daily[k]=(daily[k]||0)+getPedidoTotal(p);});
      const rows=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);rows.push({key:localDateKey(d),label:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),value:daily[localDateKey(d)]||0});}
      const bestDay=rows.reduce((a,b)=>b.value>a.value?b:a,rows[0]||null),hourMap={};current.forEach(p=>{const d=new Date(getValue(p,['created_at','DATA','data','data_pedido','DATA_PEDIDO'],''));const h=d.getHours();hourMap[h]=(hourMap[h]||0)+1;});
      let bestHour=null,bestHourCount=0;Object.entries(hourMap).forEach(([h,n])=>{if(n>bestHourCount){bestHourCount=n;bestHour=String(h).padStart(2,'0')+'h';}});
      return {revenue,orders:current.length,ticket,prevRevenue,prevOrders:previous.length,prevTicket,revenueTrend,ordersTrend,ticketTrend,rows,bestDay,bestHour};
    }

              <option value="pagamento">💳 Vendas por forma de pagamento</option>
              <option value="entrega">🛵 Vendas por forma de entrega</option>
              <option value="clientes">👥 Clientes (ticket médio e inatividade)</option>
              <option value="horarios">🕐 Horários de pico</option>
              <option value="comparativo">📊 Comparativo de períodos</option>
            </select>
          </div>
          <div class="field"><label>Data inicial</label><input type="date" id="relStart" value="${relatoriosState.start}"></div>
          <div class="field"><label>Data final</label><input type="date" id="relEnd" value="${relatoriosState.end}"></div>
          <button type="button" class="secondary-button" id="relFilter">🔎 Gerar</button>
          <button type="button" class="primary-button" id="relExport">⬇️ Exportar CSV</button>
        </div>
        <div id="relatorioBody"><div class="empty-state"><div class="empty-state-icon">🧾</div><strong>Carregando dados...</strong></div></div>
      </div>`;

      document.getElementById('relTipo').value=relatoriosState.tipo;
      document.getElementById('relTipo').addEventListener('change', e=>{ relatoriosState.tipo=e.target.value; relRenderAtual(); });
      document.getElementById('relFilter').addEventListener('click', ()=>{
        relatoriosState.start=document.getElementById('relStart').value || monthStart;
        relatoriosState.end=document.getElementById('relEnd').value || today;
        relRenderAtual();
      });
      document.getElementById('relExport').addEventListener('click', relExportarCsvAtual);

      try{
        await relCarregarDados();
        relRenderAtual();
      }catch(e){
        console.error('RELATORIOS:',e);
        const body=document.getElementById('relatorioBody');
        if(body) body.innerHTML=`<div class="empty-state"><div class="empty-state-icon">⚠️</div><strong>Não foi possível carregar os relatórios.</strong><p style="margin-top:8px;">${escapeHtml(e.message||'Erro de conexão.')}</p></div>`;
      }
    }

    async function relCarregarDados(force=false){
      if(relatoriosState.carregado && !force) return;
      const [pedidos,itens,clientes,produtos,formasPagamento,formasEntrega]=await Promise.all([
        getTable('PEDIDOS','?select=*'),
        getTable('ITENS_PEDIDO','?select=*'),
        getTable('CLIENTES','?select=*'),
        getTable('PRODUTOS','?select=*'),
        getTable('FORMAS_PAGAMENTO','?select=*'),
        getTable('FORMAS_ENTREGA','?select=*')
      ]);
      relatoriosState.dados={
        pedidos: Array.isArray(pedidos)?pedidos:[],
        itens: Array.isArray(itens)?itens:[],
        clientes: Array.isArray(clientes)?clientes:[],
        produtos: Array.isArray(produtos)?produtos:[],
        formasPagamento: Array.isArray(formasPagamento)?formasPagamento:[],
        formasEntrega: Array.isArray(formasEntrega)?formasEntrega:[]
      };
      relatoriosState.carregado=true;
    }

    function relPedidoData(p){ return getValue(p,['DATA','data','created_at','CREATED_AT'],''); }
    function relPedidoDateKey(p){ const v=relPedidoData(p); return v?localDateKey(v):''; }
    function relPedidoValor(p){ return parseMoneyValue(getValue(p,['VALOR_TOTAL','valor_total'],0)); }
    function relPedidoId(p){ return getValue(p,['id','ID'],null); }
    function relPedidoNumero(p){ return getValue(p,['NUMERO_PEDIDO','numero_pedido'],'-'); }
    function relPedidoStatus(p){ return getValue(p,['STATUS','status'],'') || '-'; }
    function relFormaPagamentoNome(id){
      if(id===null||id===undefined||id==='') return '';
      const row=relatoriosState.dados.formasPagamento.find(f=>String(getValue(f,['id','ID'],''))===String(id));
      return row?String(getValue(row,['NOME','nome'],'')||''):'';
    }
    function relFormaEntregaNome(id){
      if(id===null||id===undefined||id==='') return '';
      const row=relatoriosState.dados.formasEntrega.find(f=>String(getValue(f,['id','ID'],''))===String(id));
      return row?String(getValue(row,['NOME','nome'],'')||''):'';
    }
    function relPedidoPagamento(p){
      const texto=getValue(p,['FORMA_PAGAMENTO','forma_pagamento'],'');
      if(texto) return texto;
      const porId=relFormaPagamentoNome(getValue(p,['FORMA_PAGAMENTO_ID','forma_pagamento_id'],null));
      return porId || 'Não informado';
    }
    function relClienteNome(id){
      if(id===null||id===undefined||id==='') return '-';
      const row=relatoriosState.dados.clientes.find(c=>String(getValue(c,['id','ID'],''))===String(id));
      return row?(String(getValue(row,['NOME','nome'],'')||'').trim()||'-'):'-';
    }
    function relClienteTelefone(id){
      if(id===null||id===undefined||id==='') return '';
      const row=relatoriosState.dados.clientes.find(c=>String(getValue(c,['id','ID'],''))===String(id));
      return row?String(getValue(row,['TELEFONE','telefone'],'')||''):'';
    }
    function relProdutoNome(id){
      if(id===null||id===undefined||id==='') return '—';
      const row=relatoriosState.dados.produtos.find(pr=>String(getValue(pr,['id','ID'],''))===String(id));
      return row?(String(getValue(row,['NOME','nome'],'')||'').trim()||'—'):'—';
    }
    function relPedidosNoPeriodo(start,end){
      return relatoriosState.dados.pedidos.filter(p=>{ const d=relPedidoDateKey(p); return d && d>=start && d<=end; });
    }
    function relItensDoPedido(pedidoId){
      return relatoriosState.dados.itens.filter(it=>String(getValue(it,['PEDIDO_ID','pedido_id'],''))===String(pedidoId));
    }

    function relRenderAtual(){
      const body=document.getElementById('relatorioBody');
      if(!body) return;
      const { start, end } = relatoriosState;
      const mapa={
        'fluxo-caixa': relRenderFluxoCaixa,
        'produtos': relRenderProdutos,
        'pagamento': relRenderPagamento,
        'entrega': relRenderEntrega,
        'clientes': relRenderClientes,
        'horarios': relRenderHorarios,
        'comparativo': relRenderComparativo
      };
      (mapa[relatoriosState.tipo] || relRenderFluxoCaixa)(body,start,end);
    }

    function relRenderFluxoCaixa(body,start,end){
      const pedidos=relPedidosNoPeriodo(start,end).sort((a,b)=>String(relPedidoData(b)).localeCompare(String(relPedidoData(a))));
      const linhas=[];
      pedidos.forEach(p=>{
        const itens=relItensDoPedido(relPedidoId(p));
        const clienteNome=relClienteNome(getValue(p,['CLIENTE_ID','cliente_id'],null));
        const pagamento=relPedidoPagamento(p);
        const status=relPedidoStatus(p);
        const dataFmt=formatDateTime(relPedidoData(p));
        if(itens.length){
          itens.forEach(it=>{
            linhas.push({
              data:dataFmt, pedido:relPedidoNumero(p), cliente:clienteNome,
              produto:relProdutoNome(getValue(it,['PRODUTO_ID','produto_id'],null)),
              qtd:getValue(it,['QUANTIDADE','quantidade'],0),
              valorUnit:parseMoneyValue(getValue(it,['PRECO_UNITARIO','preco_unitario'],0)),
              valorItem:parseMoneyValue(getValue(it,['VALOR_ITEM','valor_item'],0)),
              pagamento, status
            });
          });
        } else {
          linhas.push({data:dataFmt,pedido:relPedidoNumero(p),cliente:clienteNome,produto:'—',qtd:'-',valorUnit:0,valorItem:relPedidoValor(p),pagamento,status});
        }
      });
      const totalValor=linhas.reduce((s,l)=>s+(Number(l.valorItem)||0),0);
      relatoriosState.exportHeaders=['Data','Pedido','Cliente','Produto','Qtd','Valor Unitário','Valor Item','Forma de Pagamento','Status'];
      relatoriosState.exportRows=linhas.map(l=>[l.data,l.pedido,l.cliente,l.produto,l.qtd,l.valorUnit,l.valorItem,l.pagamento,l.status]);
      body.innerHTML=`
        <div class="financeiro-grid" style="margin-bottom:16px;">
          <div class="financeiro-card positivo"><div class="label">💵 TOTAL NO PERÍODO</div><div class="value">${formatMoney(totalValor)}</div><div class="hint">${pedidos.length} pedido(s)</div></div>
          <div class="financeiro-card"><div class="label">🧾 ITENS NO RELATÓRIO</div><div class="value">${linhas.length}</div><div class="hint">linha(s)</div></div>
        </div>
        <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Valor Unit.</th><th>Valor Item</th><th>Pagamento</th><th>Status</th></tr></thead><tbody>
        ${linhas.length?linhas.map(l=>`<tr><td>${escapeHtml(l.data)}</td><td>${escapeHtml(String(l.pedido))}</td><td>${escapeHtml(l.cliente)}</td><td>${escapeHtml(l.produto)}</td><td>${escapeHtml(String(l.qtd))}</td><td>${formatMoney(l.valorUnit)}</td><td><strong>${formatMoney(l.valorItem)}</strong></td><td>${escapeHtml(l.pagamento)}</td><td>${escapeHtml(l.status)}</td></tr>`).join(''):'<tr><td colspan="9">Nenhum pedido encontrado no período.</td></tr>'}
        </tbody></table></div>`;
    }

    function relRenderProdutos(body,start,end){
      const pedidos=relPedidosNoPeriodo(start,end);
      const pedidoIds=new Set(pedidos.map(p=>String(relPedidoId(p))));
      const agregados=new Map();
      relatoriosState.dados.itens.forEach(it=>{
        if(!pedidoIds.has(String(getValue(it,['PEDIDO_ID','pedido_id'],'')))) return;
        const nome=relProdutoNome(getValue(it,['PRODUTO_ID','produto_id'],null));
        const qtd=Number(getValue(it,['QUANTIDADE','quantidade'],0))||0;
        const valor=parseMoneyValue(getValue(it,['VALOR_ITEM','valor_item'],0));
        const atual=agregados.get(nome)||{nome,qtd:0,valor:0};
        atual.qtd+=qtd; atual.valor+=valor;
        agregados.set(nome,atual);
      });
      const linhas=[...agregados.values()].sort((a,b)=>b.valor-a.valor);
      const totalValor=linhas.reduce((s,l)=>s+l.valor,0);
      relatoriosState.exportHeaders=['Produto','Quantidade Vendida','Valor Total'];
      relatoriosState.exportRows=linhas.map(l=>[l.nome,l.qtd,l.valor]);
      body.innerHTML=`
        <div class="financeiro-grid" style="margin-bottom:16px;">
          <div class="financeiro-card"><div class="label">🍪 PRODUTOS DIFERENTES</div><div class="value">${linhas.length}</div><div class="hint">vendidos no período</div></div>
          <div class="financeiro-card positivo"><div class="label">💰 RECEITA DE PRODUTOS</div><div class="value">${formatMoney(totalValor)}</div><div class="hint">soma dos itens vendidos</div></div>
        </div>
        <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>#</th><th>Produto</th><th>Qtd Vendida</th><th>Valor Total</th><th>% do total</th></tr></thead><tbody>
        ${linhas.length?linhas.map((l,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(l.nome)}</td><td>${l.qtd}</td><td><strong>${formatMoney(l.valor)}</strong></td><td>${totalValor?((l.valor/totalValor)*100).toFixed(1):'0'}%</td></tr>`).join(''):'<tr><td colspan="5">Nenhuma venda encontrada no período.</td></tr>'}
        </tbody></table></div>`;
    }

    function relRenderPagamento(body,start,end){
      const pedidos=relPedidosNoPeriodo(start,end);
      const agregados=new Map();
      pedidos.forEach(p=>{
        const nome=relPedidoPagamento(p);
        const valor=relPedidoValor(p);
        const atual=agregados.get(nome)||{nome,qtd:0,valor:0};
        atual.qtd+=1; atual.valor+=valor;
        agregados.set(nome,atual);
      });
      const linhas=[...agregados.values()].sort((a,b)=>b.valor-a.valor);
      const totalValor=linhas.reduce((s,l)=>s+l.valor,0);
      relatoriosState.exportHeaders=['Forma de Pagamento','Qtd Pedidos','Valor Total','% do total'];
      relatoriosState.exportRows=linhas.map(l=>[l.nome,l.qtd,l.valor,(totalValor?((l.valor/totalValor)*100).toFixed(1):'0')+'%']);
      body.innerHTML=`
        <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Forma de Pagamento</th><th>Qtd Pedidos</th><th>Valor Total</th><th>% do total</th></tr></thead><tbody>
        ${linhas.length?linhas.map(l=>`<tr><td>${escapeHtml(l.nome)}</td><td>${l.qtd}</td><td><strong>${formatMoney(l.valor)}</strong></td><td>${totalValor?((l.valor/totalValor)*100).toFixed(1):'0'}%</td></tr>`).join(''):'<tr><td colspan="4">Nenhum pedido encontrado no período.</td></tr>'}
        </tbody></table></div>`;
    }

    function relRenderEntrega(body,start,end){
      const pedidos=relPedidosNoPeriodo(start,end);
      const agregados=new Map();
      pedidos.forEach(p=>{
        const nome=relFormaEntregaNome(getValue(p,['FORMA_ENTREGA_ID','forma_entrega_id'],null))||'Não informado';
        const valor=relPedidoValor(p);
        const atual=agregados.get(nome)||{nome,qtd:0,valor:0};
        atual.qtd+=1; atual.valor+=valor;
        agregados.set(nome,atual);
      });
      const linhas=[...agregados.values()].sort((a,b)=>b.valor-a.valor);
      const totalValor=linhas.reduce((s,l)=>s+l.valor,0);
      relatoriosState.exportHeaders=['Forma de Entrega','Qtd Pedidos','Valor Total','% do total'];
      relatoriosState.exportRows=linhas.map(l=>[l.nome,l.qtd,l.valor,(totalValor?((l.valor/totalValor)*100).toFixed(1):'0')+'%']);
      body.innerHTML=`
        <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Forma de Entrega</th><th>Qtd Pedidos</th><th>Valor Total</th><th>% do total</th></tr></thead><tbody>
        ${linhas.length?linhas.map(l=>`<tr><td>${escapeHtml(l.nome)}</td><td>${l.qtd}</td><td><strong>${formatMoney(l.valor)}</strong></td><td>${totalValor?((l.valor/totalValor)*100).toFixed(1):'0'}%</td></tr>`).join(''):'<tr><td colspan="4">Nenhum pedido encontrado no período.</td></tr>'}
        </tbody></table></div>`;
    }

    function relRenderClientes(body,start,end){
      const hoje=relatoriosToday();
      const porCliente=new Map();
      relatoriosState.dados.pedidos.forEach(p=>{
        const clienteId=getValue(p,['CLIENTE_ID','cliente_id'],null);
        if(clienteId===null||clienteId===undefined||clienteId==='') return;
        const key=String(clienteId);
        const valor=relPedidoValor(p);
        const dataPedido=relPedidoDateKey(p);
        const atual=porCliente.get(key)||{clienteId,qtd:0,valor:0,ultimaData:''};
        atual.qtd+=1; atual.valor+=valor;
        if(dataPedido && dataPedido>atual.ultimaData) atual.ultimaData=dataPedido;
        porCliente.set(key,atual);
      });
      const linhas=[...porCliente.values()].map(c=>{
        const nome=relClienteNome(c.clienteId);
        const telefone=relClienteTelefone(c.clienteId);
        const ticket=c.qtd?c.valor/c.qtd:0;
        let diasInativo=null;
        if(c.ultimaData){
          diasInativo=Math.max(0,Math.floor((new Date(hoje+'T00:00:00')-new Date(c.ultimaData+'T00:00:00'))/86400000));
        }
        return {nome,telefone,qtd:c.qtd,valor:c.valor,ticket,ultimaData:c.ultimaData,diasInativo};
      }).sort((a,b)=>b.valor-a.valor);
      relatoriosState.exportHeaders=['Cliente','Telefone','Qtd Pedidos','Total Gasto','Ticket Médio','Último Pedido','Dias sem comprar'];
      relatoriosState.exportRows=linhas.map(l=>[l.nome,l.telefone,l.qtd,l.valor,l.ticket,relFormatDateBR(l.ultimaData),l.diasInativo===null?'-':l.diasInativo]);
      body.innerHTML=`
        <p style="color:var(--cinza);margin:-6px 0 14px;font-size:13px;">Este relatório considera todo o histórico de pedidos, independente do período selecionado acima.</p>
        <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Cliente</th><th>Telefone</th><th>Qtd Pedidos</th><th>Total Gasto</th><th>Ticket Médio</th><th>Último Pedido</th><th>Inatividade</th></tr></thead><tbody>
        ${linhas.length?linhas.map(l=>{
          const alerta=(typeof l.diasInativo==='number' && l.diasInativo>=30);
          const inatividadeTxt=l.diasInativo===null?'-':`${l.diasInativo} dia(s)`;
          return `<tr><td>${escapeHtml(l.nome)}</td><td>${escapeHtml(l.telefone||'-')}</td><td>${l.qtd}</td><td><strong>${formatMoney(l.valor)}</strong></td><td>${formatMoney(l.ticket)}</td><td>${relFormatDateBR(l.ultimaData)}</td><td>${alerta?`<span class="status-pill" style="background:#fff0f1;color:#b00020">⚠️ ${escapeHtml(inatividadeTxt)}</span>`:escapeHtml(inatividadeTxt)}</td></tr>`;
        }).join(''):'<tr><td colspan="7">Nenhum pedido com cliente identificado.</td></tr>'}
        </tbody></table></div>`;
    }

    function relRenderHorarios(body,start,end){
      const pedidos=relPedidosNoPeriodo(start,end);
      const porHora=new Array(24).fill(0).map(()=>({qtd:0,valor:0}));
      const diasSemana=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      const porDia=diasSemana.map(()=>({qtd:0,valor:0}));
      pedidos.forEach(p=>{
        const raw=relPedidoData(p);
        if(!raw) return;
        const d=new Date(raw);
        if(isNaN(d.getTime())) return;
        const valor=relPedidoValor(p);
        porHora[d.getHours()].qtd+=1; porHora[d.getHours()].valor+=valor;
        porDia[d.getDay()].qtd+=1; porDia[d.getDay()].valor+=valor;
      });
      const maxHoraQtd=Math.max(1,...porHora.map(h=>h.qtd));
      relatoriosState.exportHeaders=['Hora','Qtd Pedidos','Valor Total'];
      relatoriosState.exportRows=porHora.map((h,i)=>[String(i).padStart(2,'0')+':00',h.qtd,h.valor]);
      body.innerHTML=`
        <div class="panel" style="margin-bottom:18px;"><div class="panel-header"><h2>🕐 Pedidos por hora do dia</h2></div>
          <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Hora</th><th>Qtd</th><th>Valor</th><th>Distribuição</th></tr></thead><tbody>
          ${porHora.some(h=>h.qtd)?porHora.map((h,i)=>h.qtd?`<tr><td>${String(i).padStart(2,'0')}:00</td><td>${h.qtd}</td><td>${formatMoney(h.valor)}</td><td><div style="background:#e8823c;height:8px;border-radius:4px;width:${Math.max(4,Math.round(h.qtd/maxHoraQtd*100))}%;"></div></td></tr>`:'').join(''):'<tr><td colspan="4">Nenhum pedido no período.</td></tr>'}
          </tbody></table></div>
        </div>
        <div class="panel"><div class="panel-header"><h2>📅 Pedidos por dia da semana</h2></div>
          <div class="table-wrap"><table class="financeiro-tabela"><thead><tr><th>Dia</th><th>Qtd</th><th>Valor</th></tr></thead><tbody>
          ${porDia.map((d,i)=>`<tr><td>${diasSemana[i]}</td><td>${d.qtd}</td><td>${formatMoney(d.valor)}</td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
    }

    function relRenderComparativo(body,start,end){
      const d1=new Date(start+'T00:00:00'), d2=new Date(end+'T00:00:00');
      const diasPeriodo=Math.max(1,Math.round((d2-d1)/86400000)+1);
      const anteriorFim=new Date(d1); anteriorFim.setDate(anteriorFim.getDate()-1);
      const anteriorInicio=new Date(anteriorFim); anteriorInicio.setDate(anteriorInicio.getDate()-(diasPeriodo-1));
      const anteriorStart=localDateKey(anteriorInicio), anteriorEnd=localDateKey(anteriorFim);

      const atualPedidos=relPedidosNoPeriodo(start,end);
      const anteriorPedidos=relPedidosNoPeriodo(anteriorStart,anteriorEnd);
      const atualValor=atualPedidos.reduce((s,p)=>s+relPedidoValor(p),0);
      const anteriorValor=anteriorPedidos.reduce((s,p)=>s+relPedidoValor(p),0);
      const atualTicket=atualPedidos.length?atualValor/atualPedidos.length:0;
      const anteriorTicket=anteriorPedidos.length?anteriorValor/anteriorPedidos.length:0;

      const variacao=(a,b)=>b===0?(a>0?100:0):((a-b)/b*100);
      const varValor=variacao(atualValor,anteriorValor);
      const varQtd=variacao(atualPedidos.length,anteriorPedidos.length);
      const varTicket=variacao(atualTicket,anteriorTicket);
      const seta=v=>v>0?'▲':(v<0?'▼':'—');
      const cor=v=>v>0?'#137333':(v<0?'#b00020':'var(--cinza)');

      relatoriosState.exportHeaders=['Indicador','Período Atual','Período Anterior','Variação'];
      relatoriosState.exportRows=[
        ['Faturamento',atualValor,anteriorValor,varValor.toFixed(1)+'%'],
        ['Qtd Pedidos',atualPedidos.length,anteriorPedidos.length,varQtd.toFixed(1)+'%'],
        ['Ticket Médio',atualTicket,anteriorTicket,varTicket.toFixed(1)+'%']
      ];

      body.innerHTML=`
        <p style="color:var(--cinza);margin:-6px 0 14px;font-size:13px;">Comparando <strong>${relFormatDateBR(start)} a ${relFormatDateBR(end)}</strong> com o período imediatamente anterior de mesma duração (<strong>${relFormatDateBR(anteriorStart)} a ${relFormatDateBR(anteriorEnd)}</strong>).</p>
        <div class="financeiro-grid">
          <div class="financeiro-card"><div class="label">💰 FATURAMENTO</div><div class="value">${formatMoney(atualValor)}</div><div class="hint" style="color:${cor(varValor)}">${seta(varValor)} ${Math.abs(varValor).toFixed(1)}% vs ${formatMoney(anteriorValor)}</div></div>
          <div class="financeiro-card"><div class="label">📦 PEDIDOS</div><div class="value">${atualPedidos.length}</div><div class="hint" style="color:${cor(varQtd)}">${seta(varQtd)} ${Math.abs(varQtd).toFixed(1)}% vs ${anteriorPedidos.length}</div></div>
          <div class="financeiro-card"><div class="label">🎯 TICKET MÉDIO</div><div class="value">${formatMoney(atualTicket)}</div><div class="hint" style="color:${cor(varTicket)}">${seta(varTicket)} ${Math.abs(varTicket).toFixed(1)}% vs ${formatMoney(anteriorTicket)}</div></div>
        </div>`;
    }

    function relCsvEscape(value){
      if(value===null||value===undefined) return '';
      let s = typeof value==='number' ? String(value).replace('.',',') : String(value);
      if(/["";\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
      return s;
    }
